site_name: Maximo Application Suite Select help center
site_url: https://pages.github.ibm.com/WCE-ID/mas_select/
site_description: Journey-based documentation for Maximo Application Suite Select
site_author: Yvette Harrington
use_directory_urls: false

# GitHub Pages configuration
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://pages.github.ibm.com/WCE-ID/mas_select

# Repository
repo_name: WCE-ID/mas_select
repo_url: https://pages.github.ibm.com/WCE-ID/mas_select
edit_uri: edit/main/docs/

# Theme configuration - Carbon Design System theme
theme:
  name: carbon
  prefix: IBM
  custom_dir: tools/overrides
  features:
    - content.code.copy

# Extra CSS for custom styling
extra_css:
  - assets/stylesheets/extra.css

# Extra JavaScript for tooltips and navigation search
extra_javascript:
  - assets/javascripts/role-selector.js
  - assets/javascripts/abbr-tooltips.js
  - assets/javascripts/lifecycle-tooltips.js
  - assets/javascripts/tips-wrapper.js
  - assets/javascripts/page-feedback.js
  - assets/javascripts/copy-table.js
  - assets/javascripts/copy-inline-code.js

# Plugins
plugins:
  - search:
      lang: en
      separator: '[\s\-\.]+'
      min_search_length: 2
  - glightbox:
      skip_classes:
        - no-lightbox
        - info-icon
      shadow: true
      caption_position: bottom
      auto_caption: true
      touchNavigation: false
      background: black

# Extensions
markdown_extensions:
  - toc:
      permalink: "¤"
  - admonition
  - attr_list
  - md_in_html
  - abbr
  - pymdownx.snippets:
      base_path: docs
      auto_append:
        - .snippets
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

