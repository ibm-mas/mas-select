<svg width="480" height="520" viewBox="0 0 480 520" fill="none" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <title>Data onboarding pathway in Maximo Application Suite Select</title>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Step 1: Understand load order -->
  <g class="step-node">
    <rect x="20" y="20" width="440" height="64" rx="2" fill="#ffffff" stroke="#0F62FE" stroke-width="1.5"/>
    <rect x="20" y="20" width="56" height="64" rx="2" fill="#0F62FE"/>
    <rect x="68" y="20" width="8" height="64" fill="#0F62FE"/>
    <text x="48" y="58" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="88" y="42" font-size="11" font-weight="600" fill="#0F62FE" letter-spacing="0.5">STEP 1 · DEPENDENCIES</text>
    <text x="88" y="60" font-size="14" font-weight="600" fill="#161616">Understand the correct load order</text>
    <text x="88" y="75" font-size="11" font-weight="400" fill="#525252">Map referenced data and parent-child sequence</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <g class="connector">
    <line x1="240" y1="84" x2="240" y2="114" stroke="#0F62FE" stroke-width="2"/>
    <polygon points="236,110 240,118 244,110" fill="#0F62FE"/>
  </g>

  <!-- Step 2: Plan location hierarchy -->
  <g class="step-node">
    <rect x="20" y="118" width="440" height="64" rx="2" fill="#ffffff" stroke="#0F62FE" stroke-width="1.5"/>
    <rect x="20" y="118" width="56" height="64" rx="2" fill="#0F62FE"/>
    <rect x="68" y="118" width="8" height="64" fill="#0F62FE"/>
    <text x="48" y="156" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="88" y="140" font-size="11" font-weight="600" fill="#0F62FE" letter-spacing="0.5">STEP 2 · STRUCTURE</text>
    <text x="88" y="158" font-size="14" font-weight="600" fill="#161616">Plan your location hierarchy</text>
    <text x="88" y="173" font-size="11" font-weight="400" fill="#525252">Map sites, buildings, and rooms top-down on paper</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <g class="connector">
    <line x1="240" y1="182" x2="240" y2="212" stroke="#0F62FE" stroke-width="2"/>
    <polygon points="236,208 240,216 244,208" fill="#0F62FE"/>
  </g>

  <!-- Step 3: Prepare data for import -->
  <g class="step-node">
    <rect x="20" y="216" width="440" height="64" rx="2" fill="#ffffff" stroke="#0F62FE" stroke-width="1.5"/>
    <rect x="20" y="216" width="56" height="64" rx="2" fill="#0F62FE"/>
    <rect x="68" y="216" width="8" height="64" fill="#0F62FE"/>
    <text x="48" y="254" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="88" y="238" font-size="11" font-weight="600" fill="#0F62FE" letter-spacing="0.5">STEP 3 · PREPARATION</text>
    <text x="88" y="256" font-size="14" font-weight="600" fill="#161616">Prepare data for import</text>
    <text x="88" y="271" font-size="11" font-weight="400" fill="#525252">Download CSV templates, format IDs, and validate fields</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <g class="connector">
    <line x1="240" y1="280" x2="240" y2="310" stroke="#0F62FE" stroke-width="2"/>
    <polygon points="236,306 240,314 244,306" fill="#0F62FE"/>
  </g>

  <!-- Step 4: Get data into the system -->
  <g class="step-node">
    <rect x="20" y="314" width="440" height="64" rx="2" fill="#ffffff" stroke="#0F62FE" stroke-width="1.5"/>
    <rect x="20" y="314" width="56" height="64" rx="2" fill="#0F62FE"/>
    <rect x="68" y="314" width="8" height="64" fill="#0F62FE"/>
    <text x="48" y="352" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="88" y="336" font-size="11" font-weight="600" fill="#0F62FE" letter-spacing="0.5">STEP 4 · DATA LOADING</text>
    <text x="88" y="354" font-size="14" font-weight="600" fill="#161616">Get data into the system</text>
    <text x="88" y="369" font-size="11" font-weight="400" fill="#525252">Upload in Data Management, preview rows, and commit</text>
  </g>

  <!-- Connector 4 -> 5 -->
  <g class="connector">
    <line x1="240" y1="378" x2="240" y2="408" stroke="#0F62FE" stroke-width="2"/>
    <polygon points="236,404 240,412 244,404" fill="#0F62FE"/>
  </g>

  <!-- Step 5: Fix import errors -->
  <g class="step-node">
    <rect x="20" y="412" width="440" height="64" rx="2" fill="#ffffff" stroke="#0F62FE" stroke-width="1.5"/>
    <rect x="20" y="412" width="56" height="64" rx="2" fill="#0F62FE"/>
    <rect x="68" y="412" width="8" height="64" fill="#0F62FE"/>
    <text x="48" y="450" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="88" y="434" font-size="11" font-weight="600" fill="#0F62FE" letter-spacing="0.5">STEP 5 · TROUBLESHOOTING</text>
    <text x="88" y="452" font-size="14" font-weight="600" fill="#161616">Fix import errors</text>
    <text x="88" y="467" font-size="11" font-weight="400" fill="#525252">Resolve missing parents, date formats, and invalid values</text>
  </g>

  <!-- Bottom status note -->
  <g class="milestone-badge">
    <rect x="100" y="490" width="280" height="24" rx="12" fill="#DEFBE6" stroke="#24A148" stroke-width="1"/>
    <circle cx="116" cy="502" r="4" fill="#24A148"/>
    <text x="128" y="506" font-size="11" font-weight="600" fill="#0E6027">Ready for work orders and maintenance</text>
  </g>
</svg>
