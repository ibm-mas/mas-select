<svg width="480" height="420" viewBox="0 0 480 420" fill="none" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <title>Boundary Example: Classifying a Conveyor System</title>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Physical Location Level -->
  <g class="tier-location">
    <rect x="16" y="16" width="448" height="60" fill="#ffffff" stroke="#009D9A" stroke-width="1.5" rx="2"/>
    <rect x="16" y="16" width="48" height="60" fill="#009D9A"/>
    <g transform="translate(28, 32) scale(0.75)" fill="#ffffff">
      <path d="M16,2C9.4,2,4,7.4,4,14c0,8.8,12,16,12,16s12-7.2,12-16C28,7.4,22.6,2,16,2z M16,18c-2.2,0-4-1.8-4-4s1.8-4,4-4s4,1.8,4,4 S18.2,18,16,18z"/>
    </g>
    <text x="76" y="36" font-size="11" font-weight="600" fill="#0072C3" letter-spacing="0.5">LOCATION (PHYSICAL ROUTE)</text>
    <text x="76" y="56" font-size="13" font-weight="600" fill="#161616">Packaging zone</text>
  </g>

  <!-- Connector: Location -> Asset -->
  <path d="M240 76 V 104" stroke="#009D9A" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="240,108 236,100 244,100" fill="#009D9A"/>

  <!-- Asset Level -->
  <g class="tier-asset">
    <rect x="16" y="112" width="448" height="136" fill="#ffffff" stroke="#009D9A" stroke-width="1.5" rx="2"/>
    <rect x="16" y="112" width="48" height="136" fill="#009D9A"/>
    <g transform="translate(28, 166) scale(0.75)" fill="#ffffff">
      <path d="M26,8h-4V4c0-1.1-0.9-2-2-2H12C10.9,2,10,2.9,10,4v4H6C4.9,8,4,8.9,4,10v16c0,1.1,0.9,2,2,2h20c1.1,0,2-0.9,2-2V10 C28,8.9,27.1,8,26,8z M12,4h8v4h-8V4z M26,26H6V10h20V26z"/>
      <circle cx="16" cy="18" r="4"/>
    </g>
    <text x="76" y="132" font-size="11" font-weight="600" fill="#0072C3" letter-spacing="0.5">PARENT ASSET (EQUIPMENT PACKAGE)</text>
    <text x="76" y="152" font-size="13" font-weight="600" fill="#161616">Conveyor CV-01</text>
    <text x="76" y="172" font-size="12" fill="#525252">Serialized machine package • Carries runtime meter and PM schedule</text>

    <!-- Subassembly child asset -->
    <rect x="76" y="184" width="368" height="50" fill="#D9FBFB" stroke="#009D9A" stroke-width="1" rx="2"/>
    <text x="88" y="202" font-size="11" font-weight="600" fill="#005d5d">SUBASSEMBLY (CHILD ASSET): Drive Motor MTR-02</text>
    <text x="88" y="222" font-size="11" fill="#161616">Serialized rotating item • Tracked for overhauls, vibration tests, and rewinds</text>
  </g>

  <!-- Connector: Asset -> Spare parts -->
  <path d="M240 248 V 276" stroke="#009D9A" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="240,280 236,272 244,272" fill="#009D9A"/>

  <!-- Spare Parts Level -->
  <g class="tier-parts">
    <rect x="16" y="284" width="448" height="116" fill="#f4f4f4" stroke="#8d8d8d" stroke-width="1.5" rx="2"/>
    <rect x="16" y="284" width="48" height="116" fill="#6f6f6f"/>
    <g transform="translate(28, 330) scale(0.75)" fill="#ffffff">
      <path d="M26,6H6C4.9,6,4,6.9,4,8v16c0,1.1,0.9,2,2,2h20c1.1,0,2-0.9,2-2V8C28,6.9,27.1,6,26,6z M26,24H6V10h20V24z M10,12h12v2H10 V12z M10,16h8v2h-8V16z"/>
    </g>
    <text x="76" y="306" font-size="11" font-weight="600" fill="#525252" letter-spacing="0.5">SPARE PARTS (ITEM MASTER &amp; SPARE PARTS TAB)</text>
    <text x="76" y="326" font-size="13" font-weight="600" fill="#161616">Modular belt sections • Drive rollers • Guide bearings • Drive belts</text>
    <text x="76" y="346" font-size="12" fill="#525252">Consumable wear components • Stored in storeroom • Issued to repair WOs</text>
    
    <rect x="76" y="358" width="368" height="26" fill="#ffffff" stroke="#e0e0e0" rx="2"/>
    <text x="86" y="375" font-size="11" fill="#161616"><tspan font-weight="600" fill="#0f62fe">Key rule:</tspan> Rollers and belts are consumed on WOs; they are not separate assets.</text>
  </g>
</svg>
