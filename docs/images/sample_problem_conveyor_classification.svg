<svg width="640" height="440" viewBox="0 0 640 440" fill="none" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <title>Boundary Example: Classifying a Conveyor System</title>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Tier 1: Location -->
  <g class="tier-location">
    <rect x="24" y="16" width="592" height="76" fill="#ffffff" stroke="#009D9A" stroke-width="1.5" rx="8"/>
    <rect x="24" y="16" width="48" height="76" fill="#009D9A" rx="8"/>
    <rect x="56" y="16" width="16" height="76" fill="#009D9A"/>
    <g transform="translate(36, 42) scale(0.75)" fill="#ffffff">
      <path d="M16,2C9.4,2,4,7.4,4,14c0,8.8,12,16,12,16s12-7.2,12-16C28,7.4,22.6,2,16,2z M16,18c-2.2,0-4-1.8-4-4s1.8-4,4-4s4,1.8,4,4 S18.2,18,16,18z"/>
    </g>
    <text x="88" y="38" font-size="11" font-weight="600" fill="#0072C3" letter-spacing="0.3">Location (physical route)</text>
    <text x="88" y="58" font-size="15" font-weight="600" fill="#161616">Packaging zone</text>
    <text x="88" y="76" font-size="12" fill="#525252">Fixed physical space • Immovable route through the plant</text>
  </g>

  <!-- Connector: Location -> Asset -->
  <path d="M 320 92 V 120" stroke="#009D9A" stroke-width="1.5" stroke-dasharray="4 4"/>
  <polygon points="320,124 316,116 324,116" fill="#009D9A"/>

  <!-- Tier 2: Asset (Equipment Package) -->
  <g class="tier-asset">
    <rect x="24" y="128" width="592" height="124" fill="#ffffff" stroke="#009D9A" stroke-width="1.5" rx="8"/>
    <rect x="24" y="128" width="48" height="124" fill="#009D9A" rx="8"/>
    <rect x="56" y="128" width="16" height="124" fill="#009D9A"/>
    <g transform="translate(36, 178) scale(0.75)" fill="#ffffff">
      <path d="M26,8h-4V4c0-1.1-0.9-2-2-2H12C10.9,2,10,2.9,10,4v4H6C4.9,8,4,8.9,4,10v16c0,1.1,0.9,2,2,2h20c1.1,0,2-0.9,2-2V10 C28,8.9,27.1,8,26,8z M12,4h8v4h-8V4z M26,26H6V10h20V26z"/>
      <circle cx="16" cy="18" r="4"/>
    </g>
    <text x="88" y="150" font-size="11" font-weight="600" fill="#0072C3" letter-spacing="0.3">Parent asset (equipment package)</text>
    <text x="88" y="170" font-size="15" font-weight="600" fill="#161616">Conveyor CV-01</text>
    <text x="88" y="188" font-size="12" fill="#525252">Serialized machine package • Carries runtime meter and PM schedule</text>

    <!-- Subassembly child asset -->
    <rect x="88" y="198" width="512" height="42" fill="#D9FBFB" stroke="#009D9A" stroke-width="1" rx="4"/>
    <text x="100" y="214" font-size="11" font-weight="600" fill="#005d5d">Subassembly (child asset): Drive motor (MTR-DRV-02)</text>
    <text x="100" y="230" font-size="11" fill="#161616">Serialized rotating item • Tracked for overhauls, vibration tests, and rewinds</text>
  </g>

  <!-- Connector: Asset -> Spare Parts -->
  <path d="M 320 252 V 280" stroke="#009D9A" stroke-width="1.5" stroke-dasharray="4 4"/>
  <polygon points="320,284 316,276 324,276" fill="#009D9A"/>

  <!-- Tier 3: Spare Parts (Item Master & Spare Parts Tab) -->
  <g class="tier-parts">
    <rect x="24" y="288" width="592" height="136" fill="#f4f4f4" stroke="#8d8d8d" stroke-width="1.5" rx="8"/>
    <rect x="24" y="288" width="48" height="136" fill="#6f6f6f" rx="8"/>
    <rect x="56" y="288" width="16" height="136" fill="#6f6f6f"/>
    <g transform="translate(36, 344) scale(0.75)" fill="#ffffff">
      <path d="M26,6H6C4.9,6,4,6.9,4,8v16c0,1.1,0.9,2,2,2h20c1.1,0,2-0.9,2-2V8C28,6.9,27.1,6,26,6z M26,24H6V10h20V24z M10,12h12v2H10 V12z M10,16h8v2h-8V16z"/>
    </g>
    <text x="88" y="310" font-size="11" font-weight="600" fill="#525252" letter-spacing="0.3">Spare parts (Item Master &amp; Spare Parts tab)</text>
    <text x="88" y="332" font-size="14" font-weight="600" fill="#161616">Modular belt sections • Drive rollers • Guide bearings • Drive belts</text>
    <text x="88" y="352" font-size="12" fill="#525252">Consumable wear components • Stored in storeroom • Issued to repair work orders</text>

    <!-- Key rule note -->
    <rect x="88" y="366" width="512" height="38" fill="#ffffff" stroke="#e0e0e0" rx="4"/>
    <text x="100" y="389" font-size="12" fill="#161616"><tspan font-weight="600" fill="#0f62fe">Key rule:</tspan> Rollers and belts are consumed on work orders; they are not separate assets.</text>
  </g>
</svg>