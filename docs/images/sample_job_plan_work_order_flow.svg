  <title id="t">How job plans flow into work orders</title>
  <desc id="d">A job plan acts as a standardized template. When attached to a preventive maintenance schedule or applied to an individual work order, approval automatically creates task checklists, labor assignments, storeroom reservations, and pre-filled priorities.</desc>
