  <path d="M 392 144 Q 384 144 384 152 V 368 Q 384 376 392 376 Z" fill="#0f62fe"/>
<g transform="translate(400 164) scale(0.75)" fill="#161616"><path d="M14 21.414 9 16.413 10.413 15 14 18.586 21.585 11 23 12.415 14 21.414z"/><path d="M16,2A14,14,0,1,0,30,16,14,14,0,0,0,16,2Zm0,26A12,12,0,1,1,28,16,12,12,0,0,1,16,28Z"/></g>
  <text x="440" y="182" font-size="16" font-weight="600" fill="#161616">2. Validation checks</text>
  <text x="408" y="220" font-size="13" font-weight="500" fill="#161616">• Valid storeroom and item number</text>
  <text x="408" y="248" font-size="13" font-weight="500" fill="#161616">• Chargeable work order status</text>
  <text x="408" y="276" font-size="13" font-weight="500" fill="#161616">• Sufficient available storeroom balance</text>
  <text x="408" y="304" font-size="13" font-weight="500" fill="#161616">• Required fields populated</text>
  <text x="408" y="340" font-size="12" fill="#525252">System verifies balance and charges</text>
  <rect x="736" y="32" width="312" height="456" rx="8" fill="#f4f4f4" stroke="#8d8d8d" stroke-width="1"/>
  <rect x="736" y="32" width="312" height="48" rx="8" fill="#e0e0e0"/>
  <rect x="736" y="72" width="312" height="8" fill="#e0e0e0"/>
<g transform="translate(752 44) scale(0.75)" fill="#161616"><path d="M30,20A6,6,0,1,0,20,24.46V32l4-1.8936L28,32V24.46A5.98,5.98,0,0,0,30,20Zm-4,8.84-2-.9467L22,28.84V25.65a5.8877,5.8877,0,0,0,4,0ZM24,24a4,4,0,1,1,4-4A4.0045,4.0045,0,0,1,24,24Z"/><path d="M25,5H22V4a2.0058,2.0058,0,0,0-2-2H12a2.0058,2.0058,0,0,0-2,2V5H7A2.0058,2.0058,0,0,0,5,7V28a2.0058,2.0058,0,0,0,2,2h9V28H7V7h3v3H22V7h3v5h2V7A2.0058,2.0058,0,0,0,25,5ZM20,8H12V4h8Z"/></g>
  <text x="792" y="62" font-size="16" font-weight="600" fill="#161616">3. Simultaneous updates</text>
  <rect class="node" id="n_o1" x="752" y="104" width="280" height="88" rx="8" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/>
  <path d="M 760 104 Q 752 104 752 112 V 184 Q 752 192 760 192 Z" fill="#0f62fe"/>
<g transform="translate(768 136) scale(0.75)" fill="#161616"><path d="M30,10.68l-2-6A1,1,0,0,0,27,4H5a1,1,0,0,0-1,.68l-2,6A1.19,1.19,0,0,0,2,11v6a1,1,0,0,0,1,1H4V28H6V18h6V28H28V18h1a1,1,0,0,0,1-1V11A1.19,1.19,0,0,0,30,10.68ZM26,26H14V18H26Zm2-10H24V12H22v4H17V12H15v4H10V12H8v4H4V11.16L5.72,6H26.28L28,11.16Z"/></g>
  <text x="808" y="140" font-size="14" font-weight="600" fill="#161616">Inventory balance</text>
  <text x="808" y="162" font-size="12" fill="#525252">Deducts physical balance and logs audit</text>
  <rect class="node" id="n_o2" x="752" y="216" width="280" height="88" rx="8" fill="#ffffff" stroke="#007d79" stroke-width="1"/>
  <path d="M 760 216 Q 752 216 752 224 V 296 Q 752 304 760 304 Z" fill="#007d79"/>
<g transform="translate(768 248) scale(0.75)" fill="#161616"><path d="M27,16h-2v2h-1c-1.1,0-2,.9-2,2v2c0,1.1.9,2,2,2h4v2h-6v2h3v2h2v-2h1c1.1,0,2-.9,2-2v-2c0-1.1-.9-2-2-2h-4v-2h6v-2h-3v-2ZM28,8h-6v-4c0-1.1-.9-2-2-2h-8c-1.1,0-2,.9-2,2v4h-6c-1.1,0-2,.9-2,2v14c0,1.1.9,2,2,2h15v-2H4v-14h24v4h2v-4c0-1.1-.9-2-2-2ZM20,8h-8v-4h8v4Z"/></g>
