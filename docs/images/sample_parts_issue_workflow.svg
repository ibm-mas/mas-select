<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" width="1080" height="520" role="img" aria-labelledby="t d" style="background:#ffffff; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
  <title id="t">Parts issue and material transaction workflow</title>
  <desc id="d">When parts are issued from a work order, storeroom counter, or mobile app, the system validates the request and simultaneously updates storeroom balance, records actual costs to the work order, and checks replenishment reorder points.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#161616"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="32" y="32" width="312" height="456" rx="8" fill="#f4f4f4" stroke="#8d8d8d" stroke-width="1"/>
  <rect x="32" y="32" width="312" height="48" rx="8" fill="#e0e0e0"/>
  <rect x="32" y="72" width="312" height="8" fill="#e0e0e0"/>
<g transform="translate(48 44) scale(0.75)" fill="#161616"><path d="M20,21H12a2,2,0,0,1-2-2V17a2,2,0,0,1,2-2h8a2,2,0,0,1,2,2v2A2,2,0,0,1,20,21Zm-8-4v2h8V17Z"/><path d="M28,4H4A2,2,0,0,0,2,6v4a2,2,0,0,0,2,2V28a2,2,0,0,0,2,2H26a2,2,0,0,0,2-2V12a2,2,0,0,0,2-2V6A2,2,0,0,0,28,4ZM26,28H6V12H26Zm2-18H4V6H28v4Z"/></g>
  <text x="88" y="62" font-size="16" font-weight="600" fill="#161616">1. Issue entry methods</text>
  <rect class="node" id="n_m1" x="48" y="104" width="280" height="88" rx="8" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/>
  <path d="M 56 104 Q 48 104 48 112 V 184 Q 48 192 56 192 Z" fill="#0f62fe"/>
<g transform="translate(64 136) scale(0.75)" fill="#161616"><path d="M22 27.18 19.41 24.59 18 26 22 30 30 22 28.59 20.59 22 27.18z"/><path d="M25,5H22V4a2.0058,2.0058,0,0,0-2-2H12a2.0058,2.0058,0,0,0-2,2V5H7A2.0058,2.0058,0,0,0,5,7V28a2.0058,2.0058,0,0,0,2,2h9V28H7V7h3v3H22V7h3V18h2V7A2.0058,2.0058,0,0,0,25,5ZM20,8H12V4h8Z"/></g>
  <text x="104" y="140" font-size="14" font-weight="600" fill="#161616">From work order</text>
  <text x="104" y="162" font-size="12" fill="#525252">Materials tab on active ticket</text>
  <rect class="node" id="n_m2" x="48" y="216" width="280" height="88" rx="8" fill="#ffffff" stroke="#007d79" stroke-width="1"/>
  <path d="M 56 216 Q 48 216 48 224 V 296 Q 48 304 56 304 Z" fill="#007d79"/>
<g transform="translate(64 248) scale(0.75)" fill="#161616"><path d="M30,10.68l-2-6A1,1,0,0,0,27,4H5a1,1,0,0,0-1,.68l-2,6A1.19,1.19,0,0,0,2,11v6a1,1,0,0,0,1,1H4V28H6V18h6V28H28V18h1a1,1,0,0,0,1-1V11A1.19,1.19,0,0,0,30,10.68ZM26,26H14V18H26Zm2-10H24V12H22v4H17V12H15v4H10V12H8v4H4V11.16L5.72,6H26.28L28,11.16Z"/></g>
  <text x="104" y="252" font-size="14" font-weight="600" fill="#161616">From storeroom</text>
  <text x="104" y="274" font-size="12" fill="#525252">Inventory counter issue action</text>
  <rect class="node" id="n_m3" x="48" y="328" width="280" height="88" rx="8" fill="#ffffff" stroke="#8a3ffc" stroke-width="1"/>
  <path d="M 56 328 Q 48 328 48 336 V 408 Q 48 416 56 416 Z" fill="#8a3ffc"/>
