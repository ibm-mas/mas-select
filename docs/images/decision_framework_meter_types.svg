<svg width="680" height="280" viewBox="0 0 680 280" fill="none" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <title>Decision framework for selecting meter types and operational applications</title>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Input Node -->
  <g class="node">
    <rect x="20" y="110" width="150" height="60" rx="2" fill="#EDF5FF" stroke="#0F62FE" stroke-width="1.5"/>
    <text x="95" y="136" font-size="10" font-weight="600" fill="#0043CE" text-anchor="middle" letter-spacing="0.2">MEASUREMENT</text>
    <text x="95" y="154" font-size="12" font-weight="600" fill="#161616" text-anchor="middle">Define meter</text>
  </g>

  <!-- Connector to Decision -->
  <path d="M 170 140 H 210" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="210,136 218,140 210,144" fill="#161616"/>

  <!-- Decision Node -->
  <g class="node">
    <polygon points="280,95 340,140 280,185 220,140" fill="#ffffff" stroke="#0F62FE" stroke-width="1.5"/>
    <text x="280" y="137" font-size="10" font-weight="600" fill="#161616" text-anchor="middle">How does</text>
    <text x="280" y="151" font-size="10" font-weight="600" fill="#161616" text-anchor="middle">value behave?</text>
  </g>

  <!-- Connectors from Decision -->
  <!-- Top: Continuous -->
  <path d="M 280 95 V 50 Q 280 42 288 42 H 370" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="370,38 378,42 370,46" fill="#161616"/>
  <text x="290" y="38" font-size="9" fill="#525252">Always increments</text>

  <!-- Middle: Gauge -->
  <path d="M 340 140 H 370" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="370,136 378,140 370,144" fill="#161616"/>
  <text x="345" y="132" font-size="9" fill="#525252">Fluctuates</text>

  <!-- Bottom: Characteristic -->
  <path d="M 280 185 V 230 Q 280 238 288 238 H 370" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="370,234 378,238 370,242" fill="#161616"/>
  <text x="290" y="246" font-size="9" fill="#525252">Observation code</text>

  <!-- Outcome 1: Continuous -->
  <g class="node">
    <rect x="378" y="16" width="282" height="52" rx="2" fill="#ffffff" stroke="#0F62FE" stroke-width="1.5"/>
    <rect x="378" y="16" width="6" height="52" fill="#0F62FE"/>
    <text x="394" y="36" font-size="11" font-weight="600" fill="#0F62FE">CONTINUOUS METER</text>
    <text x="394" y="53" font-size="11" fill="#161616">Run hours, cycles: Drives usage PMs</text>
  </g>

  <!-- Outcome 2: Gauge -->
  <g class="node">
    <rect x="378" y="114" width="282" height="52" rx="2" fill="#ffffff" stroke="#0F62FE" stroke-width="1.5"/>
    <rect x="378" y="114" width="6" height="52" fill="#0F62FE"/>
    <text x="394" y="134" font-size="11" font-weight="600" fill="#0F62FE">GAUGE METER</text>
    <text x="394" y="151" font-size="11" fill="#161616">Temperature, PSI: Drives condition limits</text>
  </g>

  <!-- Outcome 3: Characteristic -->
  <g class="node">
    <rect x="378" y="212" width="282" height="52" rx="2" fill="#ffffff" stroke="#0F62FE" stroke-width="1.5"/>
    <rect x="378" y="212" width="6" height="52" fill="#0F62FE"/>
    <text x="394" y="232" font-size="11" font-weight="600" fill="#0F62FE">CHARACTERISTIC METER</text>
    <text x="394" y="249" font-size="11" fill="#161616">Clarity, wear: Evaluates ALN domain values</text>
  </g>
</svg>
