<svg width="680" height="300" viewBox="0 0 680 300" fill="none" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <title>Four-tier failure code hierarchy architecture</title>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Tier 1: Failure Class -->
  <g class="node">
    <rect x="20" y="110" width="130" height="60" rx="2" fill="#0F62FE" stroke="#0F62FE" stroke-width="1.5"/>
    <text x="85" y="133" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.2">TIER 1: CLASS</text>
    <text x="85" y="152" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">PUMPS</text>
  </g>

  <!-- Connectors to Tier 2 -->
  <path d="M 150 140 H 175 V 70 Q 175 62 183 62 H 195" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="195,58 203,62 195,66" fill="#161616"/>

  <path d="M 150 140 H 175 V 210 Q 175 218 183 218 H 195" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="195,214 203,218 195,222" fill="#161616"/>

  <!-- Tier 2: Problems -->
  <g class="node">
    <rect x="203" y="36" width="130" height="52" rx="2" fill="#EDF5FF" stroke="#0F62FE" stroke-width="1.5"/>
    <text x="215" y="56" font-size="9" font-weight="600" fill="#0043CE">TIER 2: PROBLEM</text>
    <text x="215" y="73" font-size="11" font-weight="600" fill="#161616">LEAK (Fluid leak)</text>
  </g>

  <g class="node">
    <rect x="203" y="192" width="130" height="52" rx="2" fill="#EDF5FF" stroke="#0F62FE" stroke-width="1.5"/>
    <text x="215" y="212" font-size="9" font-weight="600" fill="#0043CE">TIER 2: PROBLEM</text>
    <text x="215" y="229" font-size="11" font-weight="600" fill="#161616">HIGH_TEMP (Heat)</text>
  </g>

  <!-- Connectors to Tier 3 -->
  <path d="M 333 62 H 365" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="365,58 373,62 365,66" fill="#161616"/>

  <!-- Tier 3: Causes -->
  <g class="node">
    <rect x="373" y="36" width="130" height="52" rx="2" fill="#ffffff" stroke="#0F62FE" stroke-width="1.5"/>
    <rect x="373" y="36" width="5" height="52" fill="#0F62FE"/>
    <text x="388" y="56" font-size="9" font-weight="600" fill="#0F62FE">TIER 3: CAUSE</text>
    <text x="388" y="73" font-size="11" font-weight="600" fill="#161616">SEAL_WEAR</text>
  </g>

  <!-- Connectors to Tier 4 -->
  <path d="M 503 62 H 520 V 35 Q 520 27 528 27 H 535" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="535,23 543,27 535,31" fill="#161616"/>

  <path d="M 503 62 H 520 V 97 Q 520 105 528 105 H 535" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="535,101 543,105 535,109" fill="#161616"/>

  <!-- Tier 4: Remedies -->
  <g class="node">
    <rect x="543" y="10" width="120" height="42" rx="2" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
    <text x="553" y="27" font-size="8" font-weight="600" fill="#525252">TIER 4: REMEDY</text>
    <text x="553" y="42" font-size="10" font-weight="600" fill="#161616">REPLACE_SEAL</text>
  </g>

  <g class="node">
    <rect x="543" y="88" width="120" height="42" rx="2" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
    <text x="553" y="105" font-size="8" font-weight="600" fill="#525252">TIER 4: REMEDY</text>
    <text x="553" y="120" font-size="10" font-weight="600" fill="#161616">FLUSH_LINE</text>
  </g>
</svg>
