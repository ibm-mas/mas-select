<svg width="680" height="280" viewBox="0 0 680 280" fill="none" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <title>Cross-shift standardization structure and unified reporting</title>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Enterprise Standards Container -->
  <g class="node">
    <rect x="20" y="30" width="190" height="220" rx="2" fill="#EDF5FF" stroke="#0F62FE" stroke-width="1.5"/>
    <text x="35" y="55" font-size="10" font-weight="600" fill="#0043CE" letter-spacing="0.2">ENTERPRISE STANDARDS</text>
    
    <!-- Standard 1 -->
    <rect x="30" y="70" width="170" height="45" rx="2" fill="#ffffff" stroke="#0F62FE" stroke-width="1"/>
    <text x="40" y="88" font-size="10" font-weight="600" fill="#0F62FE">Standard Crafts</text>
    <text x="40" y="103" font-size="9" fill="#525252">Uniform rates &amp; skills</text>

    <!-- Standard 2 -->
    <rect x="30" y="125" width="170" height="45" rx="2" fill="#ffffff" stroke="#0F62FE" stroke-width="1"/>
    <text x="40" y="143" font-size="10" font-weight="600" fill="#0F62FE">Standard Job Plans</text>
    <text x="40" y="158" font-size="9" fill="#525252">Uniform steps &amp; parts</text>

    <!-- Standard 3 -->
    <rect x="30" y="180" width="170" height="45" rx="2" fill="#ffffff" stroke="#0F62FE" stroke-width="1"/>
    <text x="40" y="198" font-size="10" font-weight="600" fill="#0F62FE">Standard Failure Codes</text>
    <text x="40" y="213" font-size="9" fill="#525252">Uniform root causes</text>
  </g>

  <!-- Connectors to Shifts -->
  <path d="M 210 92 H 240 V 65 Q 240 58 248 58 H 270" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="270,54 278,58 270,62" fill="#161616"/>

  <path d="M 210 148 H 270" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="270,144 278,148 270,152" fill="#161616"/>

  <path d="M 210 202 H 240 V 222 Q 240 230 248 230 H 270" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="270,226 278,230 270,234" fill="#161616"/>

  <!-- Shift Nodes -->
  <g class="node">
    <rect x="278" y="30" width="160" height="70" rx="2" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
    <text x="290" y="55" font-size="10" font-weight="600" fill="#525252">SHIFT 1 EXECUTION</text>
    <text x="290" y="73" font-size="11" font-weight="600" fill="#161616">Day Maintenance</text>
    <text x="290" y="88" font-size="9" fill="#525252">Logs identical failure codes</text>
  </g>

  <g class="node">
    <rect x="278" y="180" width="160" height="70" rx="2" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
    <text x="290" y="205" font-size="10" font-weight="600" fill="#525252">SHIFT 2 EXECUTION</text>
    <text x="290" y="223" font-size="11" font-weight="600" fill="#161616">Night Maintenance</text>
    <text x="290" y="238" font-size="9" fill="#525252">Follows identical job steps</text>
  </g>

  <!-- Connectors to Reporting -->
  <path d="M 438 65 H 470 V 132 Q 470 140 478 140 H 490" fill="none" stroke="#161616" stroke-width="1.5"/>
  <path d="M 438 215 H 470 V 148 Q 470 140 478 140 H 490" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="490,136 498,140 490,144" fill="#161616"/>

  <!-- Unified Reporting Node -->
  <g class="node">
    <rect x="498" y="105" width="160" height="70" rx="2" fill="#0F62FE" stroke="#0F62FE" stroke-width="1.5"/>
    <text x="578" y="128" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.2">UNIFIED REPORTING</text>
    <text x="578" y="146" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">KPI Viewer</text>
    <text x="578" y="160" font-size="9" fill="#EDF5FF" text-anchor="middle">True benchmark comparison</text>
  </g>
</svg>
