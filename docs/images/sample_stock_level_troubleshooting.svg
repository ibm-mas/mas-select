<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .header-box { fill: #edf5ff; stroke: #0f62fe; stroke-width: 1px; }
      .step-box { fill: #f4f4f4; stroke: #8d8d8d; stroke-width: 1px; }
      .step-box-active { fill: #edf5ff; stroke: #0f62fe; stroke-width: 1px; }
      .resolution-box { fill: #defbe6; stroke: #24a148; stroke-width: 1px; }
      .adjustment-box { fill: #fbf1e8; stroke: #fa4d56; stroke-width: 1px; }
      .header-title { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; fill: #0043ce; }
      .header-sub { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; fill: #161616; }
      .node-title { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; fill: #161616; }
      .node-desc { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; fill: #525252; }
      .res-title { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; fill: #0e6027; }
      .res-desc { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; fill: #161616; }
      .adj-title { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; fill: #da1e28; }
      .adj-desc { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; fill: #161616; }
      .badge-found { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; fill: #0e6027; }
      .badge-missing { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; fill: #da1e28; }
      .icon-fill { fill: #161616; }
      .icon-blue { fill: #0f62fe; }
      .icon-green { fill: #24a148; }
      .icon-red { fill: #da1e28; }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#161616" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="480" class="bg" />

  <!-- Symptom / Header Node -->
  <rect class="node header-box" id="n_hdr" x="40" y="16" width="288" height="48" rx="4" />
  <g transform="translate(52, 28) scale(0.75)">
    <path class="icon-blue" d="M14 2a12 12 0 1 0 12 12A12.013 12.013 0 0 0 14 2zm0 22a10 10 0 1 1 10-10 10.011 10.011 0 0 1-10 10z"/>
    <path class="icon-blue" d="M13 7h2v8h-2zm0 10h2v2h-2z"/>
  </g>
  <text x="80" y="34" font-size="13" class="header-title">Diagnostic Trigger</text>
  <text x="80" y="50" font-size="11" class="header-sub">Balance in stock, but missing on shelf</text>

  <!-- Step 1: Check Bin Locations -->
  <rect class="node step-box" id="n_step1" x="40" y="88" width="288" height="64" rx="4" />
  <g transform="translate(52, 104) scale(0.75)">
    <path class="icon-fill" d="M26 4H6a2 2 0 0 0-2 2v20a2 2 0 0 0 2 2h20a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM6 6h8v8H6zm0 10h8v10H6zm10 10V16h10v10zm10-12H16V6h10z"/>
  </g>
  <text x="80" y="112" font-size="13" class="node-title">1. Verify bin locations</text>
  <text x="80" y="130" font-size="11" class="node-desc">Check primary, secondary, and staging</text>

  <rect class="node resolution-box" id="n_res1" x="392" y="96" width="248" height="48" rx="4" />
  <g transform="translate(404, 110) scale(0.75)">
    <path class="icon-green" d="M14 2a12 12 0 1 0 12 12A12 12 0 0 0 14 2zm-1.5 17.5L6.8 13.8l1.4-1.4 4.3 4.3 8.3-8.3 1.4 1.4z"/>
  </g>
  <text x="432" y="116" font-size="12" class="res-title">Item in alternate bin</text>
  <text x="432" y="132" font-size="11" class="res-desc">Pick item and update bin assignment</text>

  <!-- Step 2: Check Transfers & Storerooms -->
  <rect class="node step-box" id="n_step2" x="40" y="184" width="288" height="64" rx="4" />
  <g transform="translate(52, 200) scale(0.75)">
    <path class="icon-fill" d="M27 16.5l-4-5A1 1 0 0 0 22.2 11H18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h2.2a4 4 0 0 0 7.6 0h4.4a4 4 0 0 0 7.6 0H28a2 2 0 0 0 2-2v-4.5a1 1 0 0 0-1-1zM4 6h12v12H4zm6 18a2 2 0 1 1 2-2 2 2 0 0 1-2 2zm14 0a2 2 0 1 1 2-2 2 2 0 0 1-2 2zm4-6h-2.2a4 4 0 0 0-3.8-3H18v-2h4l3.2 4z"/>
  </g>
  <text x="80" y="208" font-size="13" class="node-title">2. Check transfers and receipts</text>
  <text x="80" y="226" font-size="11" class="node-desc">Verify in-transit transfers and receipts</text>

  <rect class="node resolution-box" id="n_res2" x="392" y="192" width="248" height="48" rx="4" />
  <g transform="translate(404, 206) scale(0.75)">
    <path class="icon-green" d="M14 2a12 12 0 1 0 12 12A12 12 0 0 0 14 2zm-1.5 17.5L6.8 13.8l1.4-1.4 4.3 4.3 8.3-8.3 1.4 1.4z"/>
  </g>
  <text x="432" y="212" font-size="12" class="res-title">In-transit or receiving area</text>
  <text x="432" y="228" font-size="11" class="res-desc">Complete pending receipt or transfer</text>

  <!-- Step 3: Check Reservations & Pick Lists -->
  <rect class="node step-box" id="n_step3" x="40" y="280" width="288" height="64" rx="4" />
  <g transform="translate(52, 296) scale(0.75)">
    <path class="icon-fill" d="M22 28H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h12l8 8v16a2 2 0 0 1-2 2zM6 4v22h16V10h-6V4zm2 8h6v2H8zm0 5h12v2H8zm0 5h12v2H8z"/>
  </g>
  <text x="80" y="304" font-size="13" class="node-title">3. Check reservations and kits</text>
  <text x="80" y="322" font-size="11" class="node-desc">Inspect active work orders and kits</text>

  <rect class="node resolution-box" id="n_res3" x="392" y="288" width="248" height="48" rx="4" />
  <g transform="translate(404, 302) scale(0.75)">
    <path class="icon-green" d="M14 2a12 12 0 1 0 12 12A12 12 0 0 0 14 2zm-1.5 17.5L6.8 13.8l1.4-1.4 4.3 4.3 8.3-8.3 1.4 1.4z"/>
  </g>
  <text x="432" y="308" font-size="12" class="res-title">Allocated to active work order</text>
  <text x="432" y="324" font-size="11" class="res-desc">Item is reserved or kitted for work</text>

  <!-- Step 4: Conduct Physical Count -->
  <rect class="node step-box-active" id="n_step4" x="40" y="376" width="288" height="64" rx="4" />
  <g transform="translate(52, 392) scale(0.75)">
    <path class="icon-blue" d="M24 4h-4.18C19.4 2.84 18.3 2 17 2h-2c-1.3 0-2.4.84-2.82 2H8a2 2 0 0 0-2 2v20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm-9-0.5c.55 0 1 .45 1 1v.5h-4v-.5c0-.55.45-1 1-1h2zM8 6h2v3h12V6h2v20H8z"/>
  </g>
  <text x="80" y="400" font-size="13" class="node-title">4. Conduct physical count</text>
  <text x="80" y="418" font-size="11" class="node-desc">Count shelf stock to confirm variance</text>

  <rect class="node adjustment-box" id="n_res4" x="392" y="384" width="248" height="48" rx="4" />
  <g transform="translate(404, 398) scale(0.75)">
    <path class="icon-red" d="M14 2a12 12 0 1 0 12 12A12.013 12.013 0 0 0 14 2zm0 22a10 10 0 1 1 10-10 10.011 10.011 0 0 1-10 10z"/>
    <path class="icon-red" d="M13 7h2v8h-2zm0 10h2v2h-2z"/>
  </g>
  <text x="432" y="404" font-size="12" class="adj-title">Adjust physical inventory</text>
  <text x="432" y="420" font-size="11" class="adj-desc">Enter adjustment to reconcile balance</text>

  <!-- Connectors -->
  <path class="connector" id="k0" data-from="n_hdr" data-to="n_step1" fill="none" stroke="#161616" stroke-width="1" marker-end="url(#arrow)" d="M 184 64 V 88"/>

  <path class="connector" id="k1" data-from="n_step1" data-to="n_res1" fill="none" stroke="#161616" stroke-width="1" marker-end="url(#arrow)" d="M 328 120 H 392"/>
  <rect x="336" y="98" width="48" height="16" fill="#ffffff" rx="2" />
  <text x="344" y="110" font-size="10" class="conn-label badge-found">Found</text>

  <path class="connector" id="k2" data-from="n_step1" data-to="n_step2" fill="none" stroke="#161616" stroke-width="1" marker-end="url(#arrow)" d="M 184 152 V 184"/>
  <rect x="192" y="160" width="56" height="16" fill="#ffffff" rx="2" />
  <text x="196" y="172" font-size="10" class="conn-label badge-missing">Missing</text>

  <path class="connector" id="k3" data-from="n_step2" data-to="n_res2" fill="none" stroke="#161616" stroke-width="1" marker-end="url(#arrow)" d="M 328 216 H 392"/>
  <rect x="336" y="194" width="48" height="16" fill="#ffffff" rx="2" />
  <text x="340" y="206" font-size="10" class="conn-label badge-found">Located</text>

  <path class="connector" id="k4" data-from="n_step2" data-to="n_step3" fill="none" stroke="#161616" stroke-width="1" marker-end="url(#arrow)" d="M 184 248 V 280"/>
  <rect x="192" y="256" width="56" height="16" fill="#ffffff" rx="2" />
  <text x="196" y="268" font-size="10" class="conn-label badge-missing">Missing</text>

  <path class="connector" id="k5" data-from="n_step3" data-to="n_res3" fill="none" stroke="#161616" stroke-width="1" marker-end="url(#arrow)" d="M 328 312 H 392"/>
  <rect x="336" y="290" width="48" height="16" fill="#ffffff" rx="2" />
  <text x="342" y="302" font-size="10" class="conn-label badge-found">Staged</text>

  <path class="connector" id="k6" data-from="n_step3" data-to="n_step4" fill="none" stroke="#161616" stroke-width="1" marker-end="url(#arrow)" d="M 184 344 V 376"/>
  <rect x="192" y="352" width="56" height="16" fill="#ffffff" rx="2" />
  <text x="196" y="364" font-size="10" class="conn-label badge-missing">Missing</text>

  <path class="connector" id="k7" data-from="n_step4" data-to="n_res4" fill="none" stroke="#161616" stroke-width="1" marker-end="url(#arrow)" d="M 328 408 H 392"/>
  <rect x="336" y="386" width="48" height="16" fill="#ffffff" rx="2" />
  <text x="338" y="398" font-size="10" class="conn-label badge-missing">Variance</text>
</svg>