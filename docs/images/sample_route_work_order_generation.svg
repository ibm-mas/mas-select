  <text x="520" y="160" font-size="12" font-weight="600" fill="#161616">• WO 101: Filler FL-02</text>
  <text x="760" y="160" font-size="11" fill="#525252">Independent history and cost closure</text>
  <rect x="504" y="176" width="528" height="24" rx="4" fill="#f4f4f4" stroke="#8d8d8d" stroke-width="1"/>
  <text x="520" y="192" font-size="12" font-weight="600" fill="#161616">• WO 102: Spiral Freezer SF-01</text>
  <text x="760" y="192" font-size="11" fill="#525252">Independent history and cost closure</text>
