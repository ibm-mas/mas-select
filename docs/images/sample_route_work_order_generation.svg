<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" width="1080" height="520" role="img" aria-labelledby="t d" style="background:#ffffff; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
  <title id="t">How routes generate work orders across multiple inspection stops</title>
  <desc id="d">A multi-stop route groups inspection points across equipment. Generating work from the route can produce either separate child work orders per stop for individual tracking or a single consolidated work order with sequential tasks.</desc>
