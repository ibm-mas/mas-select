<svg width="480" height="380" viewBox="0 0 480 380" fill="none" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <title>Solution: One Physical Location Containing Multiple Assets</title>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Top Level: Room Location -->
  <g class="node">
    <rect x="16" y="16" width="448" height="48" fill="#ffffff" stroke="#009D9A" stroke-width="1.5"/>
    <rect x="16" y="16" width="48" height="48" fill="#009D9A"/>
    <g transform="translate(28, 28) scale(0.75)" fill="#ffffff">
      <path d="M16,2C9.4,2,4,7.4,4,14c0,8.8,12,16,12,16s12-7.2,12-16C28,7.4,22.6,2,16,2z M16,18c-2.2,0-4-1.8-4-4s1.8-4,4-4s4,1.8,4,4 S18.2,18,16,18z"/>
    </g>
    <text x="76" y="35" font-size="11" font-weight="600" fill="#525252" letter-spacing="0.2">PHYSICAL LOCATION</text>
    <text x="76" y="52" font-size="13" font-weight="600" fill="#161616">Filling line room</text>
  </g>

  <!-- Asset 1 -->
  <g class="node-asset">
    <rect x="56" y="80" width="408" height="48" fill="#ffffff" stroke="#009D9A" stroke-width="1.5"/>
    <rect x="56" y="80" width="48" height="48" fill="#009D9A"/>
    <g transform="translate(68, 92) scale(0.75)" fill="#ffffff">
      <path d="M26,8h-4V4c0-1.1-0.9-2-2-2H12C10.9,2,10,2.9,10,4v4H6C4.9,8,4,8.9,4,10v16c0,1.1,0.9,2,2,2h20c1.1,0,2-0.9,2-2V10 C28,8.9,27.1,8,26,8z M12,4h8v4h-8V4z M26,26H6V10h20V26z"/>
      <circle cx="16" cy="18" r="4"/>
    </g>
    <text x="116" y="99" font-size="11" font-weight="600" fill="#525252" letter-spacing="0.2">ASSET 1</text>
    <text x="116" y="116" font-size="13" font-weight="600" fill="#161616">Filler FL-02</text>
  </g>

  <!-- Asset 2 -->
  <g class="node-asset">
    <rect x="56" y="144" width="408" height="48" fill="#ffffff" stroke="#009D9A" stroke-width="1.5"/>
    <rect x="56" y="144" width="48" height="48" fill="#009D9A"/>
    <g transform="translate(68, 156) scale(0.75)" fill="#ffffff">
      <path d="M26,8h-4V4c0-1.1-0.9-2-2-2H12C10.9,2,10,2.9,10,4v4H6C4.9,8,4,8.9,4,10v16c0,1.1,0.9,2,2,2h20c1.1,0,2-0.9,2-2V10 C28,8.9,27.1,8,26,8z M12,4h8v4h-8V4z M26,26H6V10h20V26z"/>
      <circle cx="16" cy="18" r="4"/>
    </g>
    <text x="116" y="163" font-size="11" font-weight="600" fill="#525252" letter-spacing="0.2">ASSET 2</text>
    <text x="116" y="180" font-size="13" font-weight="600" fill="#161616">Syrup Pump P-101</text>
  </g>

  <!-- Asset 3 -->
  <g class="node-asset">
    <rect x="56" y="208" width="408" height="48" fill="#ffffff" stroke="#009D9A" stroke-width="1.5"/>
    <rect x="56" y="208" width="48" height="48" fill="#009D9A"/>
    <g transform="translate(68, 220) scale(0.75)" fill="#ffffff">
      <path d="M26,8h-4V4c0-1.1-0.9-2-2-2H12C10.9,2,10,2.9,10,4v4H6C4.9,8,4,8.9,4,10v16c0,1.1,0.9,2,2,2h20c1.1,0,2-0.9,2-2V10 C28,8.9,27.1,8,26,8z M12,4h8v4h-8V4z M26,26H6V10h20V26z"/>
      <circle cx="16" cy="18" r="4"/>
    </g>
    <text x="116" y="227" font-size="11" font-weight="600" fill="#525252" letter-spacing="0.2">ASSET 3</text>
    <text x="116" y="244" font-size="13" font-weight="600" fill="#161616">Feed Conveyor CV-01</text>
  </g>

  <!-- Connectors -->
  <g class="connector">
    <circle cx="36" cy="64" r="3" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
    <path d="M 36 64 V 104 H 56" fill="none" stroke="#161616" stroke-width="1.5"/>
    <path d="M 36 104 V 168 H 56" fill="none" stroke="#161616" stroke-width="1.5"/>
    <path d="M 36 168 V 232 H 56" fill="none" stroke="#161616" stroke-width="1.5"/>
    <circle cx="56" cy="104" r="3" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
    <circle cx="56" cy="168" r="3" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
    <circle cx="56" cy="232" r="3" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
  </g>

  <!-- Solution Banner at Bottom -->
  <rect x="16" y="296" width="448" height="64" fill="#defbe6" stroke="#198038" stroke-width="1.5" rx="2"/>
  <text x="240" y="318" font-size="12" font-weight="600" fill="#198038" text-anchor="middle">Correct: One room contains multiple independent assets</text>
  <text x="240" y="338" font-size="11" fill="#525252" text-anchor="middle">Technicians see all room equipment in one place; assets move freely</text>
</svg>
