<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 424" width="1080" height="424" role="img" aria-labelledby="t d" style="background:#ffffff; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
  <title id="t">Example classification hierarchy</title>
  <desc id="d">Equipment divides into Filling and Packaging, Refrigeration, and Processing Equipment. Filling and Packaging contains Rotary Fillers, with the example Filler FL-02, and Case Packers. Refrigeration contains Freezers, which contain Spiral Freezers, with the example Spiral Freezer SF-01. Processing Equipment contains Mixers, with the example Batch Mixer MX-01.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#161616"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect class="node" id="eq" x="32" y="192" width="144" height="64" rx="8" ry="8" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/>
  <path d="M 40 192 Q 32 192 32 200 V 248 Q 32 256 40 256 Z" fill="#0f62fe"/>
  <text x="56" y="229" font-size="14" font-weight="600" fill="#161616">Equipment</text>
  <rect class="node" id="fp" x="216" y="72" width="232" height="64" rx="8" ry="8" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/>
  <path d="M 224 72 Q 216 72 216 80 V 128 Q 216 136 224 136 Z" fill="#0f62fe"/>
  <text x="240" y="109" font-size="14" font-weight="600" fill="#161616">Filling and Packaging</text>
  <rect class="node" id="rf" x="488" y="32" width="256" height="64" rx="8" ry="8" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/>
  <path d="M 496 32 Q 488 32 488 40 V 88 Q 488 96 496 96 Z" fill="#0f62fe"/>
  <text x="512" y="60" font-size="14" font-weight="600" fill="#161616">Rotary Fillers</text>
  <text x="512" y="80" font-size="14" fill="#161616">Example: Filler FL-02</text>
  <rect class="node" id="cp" x="488" y="112" width="256" height="64" rx="8" ry="8" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/>
  <path d="M 496 112 Q 488 112 488 120 V 168 Q 488 176 496 176 Z" fill="#0f62fe"/>
  <text x="512" y="149" font-size="14" font-weight="600" fill="#161616">Case Packers</text>
  <rect class="node" id="rg" x="216" y="192" width="232" height="64" rx="8" ry="8" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/>
  <path d="M 224 192 Q 216 192 216 200 V 248 Q 216 256 224 256 Z" fill="#0f62fe"/>
  <text x="240" y="229" font-size="14" font-weight="600" fill="#161616">Refrigeration</text>
  <rect class="node" id="fz" x="488" y="192" width="256" height="64" rx="8" ry="8" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/>
  <path d="M 496 192 Q 488 192 488 200 V 248 Q 488 256 496 256 Z" fill="#0f62fe"/>
  <text x="512" y="229" font-size="14" font-weight="600" fill="#161616">Freezers</text>
  <rect class="node" id="sf" x="784" y="192" width="264" height="64" rx="8" ry="8" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/>
  <path d="M 792 192 Q 784 192 784 200 V 248 Q 784 256 792 256 Z" fill="#0f62fe"/>
  <text x="808" y="220" font-size="14" font-weight="600" fill="#161616">Spiral Freezers</text>
  <text x="808" y="240" font-size="14" fill="#161616">Example: Spiral Freezer SF-01</text>
  <rect class="node" id="pe" x="216" y="272" width="232" height="64" rx="8" ry="8" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/>
  <path d="M 224 272 Q 216 272 216 280 V 328 Q 216 336 224 336 Z" fill="#0f62fe"/>
  <text x="240" y="309" font-size="14" font-weight="600" fill="#161616">Processing Equipment</text>
  <rect class="node" id="mx" x="488" y="272" width="256" height="64" rx="8" ry="8" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/>
  <path d="M 496 272 Q 488 272 488 280 V 328 Q 488 336 496 336 Z" fill="#0f62fe"/>
  <text x="512" y="300" font-size="14" font-weight="600" fill="#161616">Mixers</text>
  <text x="512" y="320" font-size="14" fill="#161616">Example: Batch Mixer MX-01</text>
  <path class="connector" id="k1" data-from="eq" data-to="fp" fill="none" stroke="#161616" stroke-width="1" marker-end="url(#arrow)" d="M 176 224 H 184 Q 192 224 192 216 V 112 Q 192 104 200 104 H 216"/>
  <path class="connector" id="k2" data-from="eq" data-to="rg" fill="none" stroke="#161616" stroke-width="1" marker-end="url(#arrow)" d="M 176 224 H 216"/>
  <path class="connector" id="k3" data-from="eq" data-to="pe" fill="none" stroke="#161616" stroke-width="1" marker-end="url(#arrow)" d="M 176 224 H 184 Q 192 224 192 232 V 296 Q 192 304 200 304 H 216"/>
  <path class="connector" id="k4" data-from="fp" data-to="rf" fill="none" stroke="#161616" stroke-width="1" marker-end="url(#arrow)" d="M 448 104 H 456 Q 464 104 464 96 V 72 Q 464 64 472 64 H 488"/>
  <path class="connector" id="k5" data-from="fp" data-to="cp" fill="none" stroke="#161616" stroke-width="1" marker-end="url(#arrow)" d="M 448 104 H 456 Q 464 104 464 112 V 136 Q 464 144 472 144 H 488"/>
  <path class="connector" id="k6" data-from="rg" data-to="fz" fill="none" stroke="#161616" stroke-width="1" marker-end="url(#arrow)" d="M 448 224 H 488"/>
  <path class="connector" id="k7" data-from="fz" data-to="sf" fill="none" stroke="#161616" stroke-width="1" marker-end="url(#arrow)" d="M 744 224 H 784"/>
  <path class="connector" id="k8" data-from="pe" data-to="mx" fill="none" stroke="#161616" stroke-width="1" marker-end="url(#arrow)" d="M 448 304 H 488"/>
  <text x="32" y="380" font-size="12" font-weight="600" fill="#161616">Legend:</text>
  <rect x="112" y="364" width="48" height="24" rx="8" ry="8" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/>
  <path d="M 120 364 Q 112 364 112 372 V 380 Q 112 388 120 388 Z" fill="#0f62fe"/>
  <text x="168" y="380" font-size="12" fill="#161616">Classification</text>
  <path d="M 352 376 H 400" fill="none" stroke="#161616" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="408" y="380" font-size="12" fill="#161616">More specific classification</text>
</svg>
