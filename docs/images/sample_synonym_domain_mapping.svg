<svg width="680" height="240" viewBox="0 0 680 240" fill="none" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <title>Synonym domain mapping to system base status</title>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Base Status Node -->
  <g class="node">
    <rect x="20" y="90" width="160" height="60" rx="2" fill="#0F62FE" stroke="#0F62FE" stroke-width="1.5"/>
    <text x="100" y="113" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.2">SYSTEM BASE STATUS</text>
    <text x="100" y="132" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">WAPPR</text>
  </g>

  <!-- Connectors to 3 Display Statuses -->
  <!-- Top: Standard -->
  <path d="M 180 120 H 210 V 42 Q 210 34 218 34 H 240" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="240,30 248,34 240,38" fill="#161616"/>

  <!-- Middle: Food Safety -->
  <path d="M 180 120 H 240" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="240,116 248,120 240,124" fill="#161616"/>

  <!-- Bottom: Environmental Permit -->
  <path d="M 180 120 H 210 V 198 Q 210 206 218 206 H 240" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="240,202 248,206 240,210" fill="#161616"/>

  <!-- Status 1: Standard WAPPR -->
  <g class="node">
    <rect x="248" y="10" width="410" height="48" rx="2" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
    <text x="260" y="30" font-size="10" font-weight="600" fill="#525252">STANDARD BASE STATUS</text>
    <text x="260" y="46" font-size="11" font-weight="600" fill="#161616">Waiting on Approval (WAPPR)</text>
  </g>

  <!-- Status 2: Synonym Food Safety -->
  <g class="node">
    <rect x="248" y="96" width="410" height="48" rx="2" fill="#EDF5FF" stroke="#0F62FE" stroke-width="1.5"/>
    <rect x="248" y="96" width="5" height="48" fill="#0F62FE"/>
    <text x="265" y="116" font-size="10" font-weight="600" fill="#0043CE">SYNONYM VALUE: WFOODSAFE</text>
    <text x="265" y="132" font-size="11" font-weight="600" fill="#161616">Waiting on Food Safety Sign-off</text>
  </g>

  <!-- Status 3: Synonym Environmental -->
  <g class="node">
    <rect x="248" y="182" width="410" height="48" rx="2" fill="#EDF5FF" stroke="#0F62FE" stroke-width="1.5"/>
    <rect x="248" y="182" width="5" height="48" fill="#0F62FE"/>
    <text x="265" y="202" font-size="10" font-weight="600" fill="#0043CE">SYNONYM VALUE: WENVPERMIT</text>
    <text x="265" y="218" font-size="11" font-weight="600" fill="#161616">Waiting on Environmental Permit</text>
  </g>
</svg>
