  <title id="t">Using asset history data for maintenance decisions</title>
  <desc id="d">Tracking work orders, meter readings, and maintenance costs over time provides the historical baseline to optimize preventive maintenance schedules, adjust spare parts inventory, and evaluate repair versus replacement.</desc>
