<svg width="480" height="380" viewBox="0 0 480 380" fill="none" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <title>Moving a parent asset and location inheritance</title>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Left: Original Location (Filling line room) -->
  <g class="source-location">
    <rect x="16" y="16" width="210" height="290" fill="#f4f4f4" stroke="#8d8d8d" stroke-width="1.5" stroke-dasharray="4 4" rx="2"/>
    <rect x="16" y="16" width="210" height="32" fill="#8d8d8d"/>
    <text x="24" y="36" font-size="11" font-weight="600" fill="#ffffff" letter-spacing="0.2">ORIGINAL LOCATION</text>
    <text x="24" y="66" font-size="13" font-weight="600" fill="#525252">Filling line room</text>

    <!-- Empty / moved out indicator -->
    <rect x="28" y="90" width="186" height="190" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="2"/>
    <text x="40" y="140" font-size="12" font-weight="500" fill="#8d8d8d" text-anchor="start">Filler FL-02 moved</text>
    <text x="40" y="160" font-size="11" font-weight="400" fill="#8d8d8d" text-anchor="start">Historical work orders</text>
    <text x="40" y="176" font-size="11" font-weight="400" fill="#8d8d8d" text-anchor="start">remain with this room</text>
  </g>

  <!-- Big Arrow: Move Action -->
  <g class="move-arrow" transform="translate(232, 140)">
    <path d="M0 16 H 12 V 8 L 22 20 L 12 32 V 24 H 0 Z" fill="#0F62FE"/>
    <text x="11" y="-6" font-size="10" font-weight="700" fill="#0F62FE" text-anchor="middle">MOVE</text>
  </g>

  <!-- Right: Destination Location (Packaging suite) -->
  <g class="dest-location">
    <rect x="254" y="16" width="210" height="290" fill="#EDF5FF" stroke="#0F62FE" stroke-width="1.5" rx="2"/>
    <rect x="254" y="16" width="210" height="32" fill="#0F62FE"/>
    <text x="262" y="36" font-size="11" font-weight="600" fill="#ffffff" letter-spacing="0.2">NEW LOCATION</text>
    <text x="262" y="66" font-size="13" font-weight="600" fill="#161616">Packaging suite</text>

    <!-- Moved Asset Package inside Destination Location -->
    <!-- Parent Asset: Filler FL-02 -->
    <rect x="264" y="86" width="190" height="42" fill="#ffffff" stroke="#009D9A" stroke-width="1.5" rx="2"/>
    <rect x="264" y="86" width="6" height="42" fill="#009D9A"/>
    <text x="276" y="102" font-size="10" font-weight="600" fill="#525252">PARENT ASSET</text>
    <text x="276" y="118" font-size="12" font-weight="600" fill="#161616">Filler FL-02</text>

    <!-- Subassembly 1: Drive motor -->
    <rect x="276" y="140" width="178" height="38" fill="#D9FBFB" stroke="#009D9A" stroke-width="1" rx="2"/>
    <rect x="276" y="140" width="4" height="38" fill="#009D9A"/>
    <text x="286" y="155" font-size="9" font-weight="600" fill="#525252">SUBASSEMBLY</text>
    <text x="286" y="169" font-size="11" font-weight="600" fill="#161616">Drive motor</text>

    <!-- Subassembly 2: Nozzle assembly -->
    <rect x="276" y="188" width="178" height="38" fill="#D9FBFB" stroke="#009D9A" stroke-width="1" rx="2"/>
    <rect x="276" y="188" width="4" height="38" fill="#009D9A"/>
    <text x="286" y="203" font-size="9" font-weight="600" fill="#525252">SUBASSEMBLY</text>
    <text x="286" y="217" font-size="11" font-weight="600" fill="#161616">Nozzle assembly</text>

    <!-- Components: Nozzle body & Shutoff valve -->
    <rect x="288" y="234" width="166" height="34" fill="#ffffff" stroke="#009D9A" stroke-width="1" rx="2"/>
    <text x="296" y="247" font-size="9" font-weight="600" fill="#525252">CHILD COMPONENTS</text>
    <text x="296" y="260" font-size="10" font-weight="600" fill="#161616">Nozzle body, Shutoff valve</text>

    <!-- Connectors inside Right Card -->
    <path d="M 270 128 V 207 H 276" fill="none" stroke="#161616" stroke-width="1"/>
    <path d="M 270 159 H 276" fill="none" stroke="#161616" stroke-width="1"/>
    <path d="M 282 226 V 251 H 288" fill="none" stroke="#161616" stroke-width="1"/>
  </g>

  <!-- Summary banner (bottom) -->
  <rect x="16" y="324" width="448" height="40" fill="#EDF5FF" stroke="#0F62FE" stroke-width="1"/>
  <text x="240" y="348" font-size="11" font-weight="600" fill="#0F62FE" text-anchor="middle">Rule: Moving a parent asset automatically moves all child subassemblies</text>
</svg>