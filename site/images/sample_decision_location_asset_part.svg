<svg width="640" height="460" viewBox="0 0 640 460" fill="none" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <title>The three-way classification model: Location vs Asset vs Spare Part</title>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Tier 1: Location -->
  <g class="tier-location">
    <rect x="24" y="16" width="592" height="88" fill="#ffffff" stroke="#009D9A" stroke-width="1.5" rx="8"/>
    <rect x="24" y="16" width="48" height="88" fill="#009D9A" rx="8"/>
    <rect x="56" y="16" width="16" height="88" fill="#009D9A"/>
    <g transform="translate(36, 48) scale(0.75)" fill="#ffffff"></g>
    <text x="88" y="40" font-size="11" font-weight="600" fill="#0072C3" letter-spacing="0.3">1. LOCATION (PHYSICAL SPACE)</text>
    <text x="88" y="62" font-size="15" font-weight="600" fill="#161616">Filling line room</text>
    <text x="88" y="84" font-size="12" fill="#525252">Fixed physical space • Immovable • Room maintenance history</text>
  </g>

  <!-- Connector: Location -> Asset -->
  <path d="M 320 104 V 136" stroke="#009D9A" stroke-width="1.5" stroke-dasharray="4 4"/>
  <polygon points="320,140 316,132 324,132" fill="#009D9A"/>
  <rect x="330" y="114" width="60" height="18" fill="#ffffff" rx="2"/>
  <text x="334" y="127" font-size="11" font-weight="600" fill="#0072C3">Contains</text>

  <!-- Tier 2: Asset (Equipment) -->
  <g class="tier-asset">
    <rect x="24" y="144" width="592" height="116" fill="#ffffff" stroke="#009D9A" stroke-width="1.5" rx="8"/>
    <rect x="24" y="144" width="48" height="116" fill="#009D9A" rx="8"/>
    <rect x="56" y="144" width="16" height="116" fill="#009D9A"/>
    <g transform="translate(36, 188) scale(0.75)" fill="#ffffff"></g>
    <text x="88" y="168" font-size="11" font-weight="600" fill="#0072C3" letter-spacing="0.3">2. ASSET (MAINTAINABLE EQUIPMENT)</text>
    <text x="88" y="190" font-size="15" font-weight="600" fill="#161616">Filler FL-02</text>
    <text x="88" y="210" font-size="12" fill="#525252">Serialized machine • Moves between rooms • Has PM schedule and meter</text>
    
    <!-- Child subassembly badge inside asset -->
    <rect x="88" y="222" width="512" height="26" fill="#D9FBFB" stroke="#009D9A" stroke-width="1" rx="4"/>
    <text x="100" y="239" font-size="11" font-weight="600" fill="#005d5d">Subassembly (Child Asset): Drive motor (MTR-DRV-01)</text>
  </g>

  <!-- Connector: Asset -> Spare Parts Tab -->
  <path d="M 320 260 V 292" stroke="#009D9A" stroke-width="1.5" stroke-dasharray="4 4"/>
  <polygon points="320,296 316,288 324,288" fill="#009D9A"/>
  <rect x="330" y="270" width="168" height="18" fill="#ffffff" rx="2"/>
  <text x="334" y="283" font-size="11" font-weight="600" fill="#0072C3">References on Spare Parts tab</text>

  <!-- Tier 3: Spare Part / Item Master -->
  <g class="tier-part">
    <rect x="24" y="300" width="592" height="136" fill="#f4f4f4" stroke="#8d8d8d" stroke-width="1.5" rx="8"/>
    <rect x="24" y="300" width="48" height="136" fill="#6f6f6f" rx="8"/>
    <rect x="56" y="300" width="16" height="136" fill="#6f6f6f"/>
    <g transform="translate(36, 354) scale(0.75)" fill="#ffffff"></g>
    <text x="88" y="324" font-size="11" font-weight="600" fill="#525252" letter-spacing="0.3">3. SPARE PART (ITEM MASTER &amp; SPARE PARTS TAB)</text>
    <text x="88" y="346" font-size="14" font-weight="600" fill="#161616">Flange gaskets • O-rings • Mechanical seals • Fuses</text>
    <text x="88" y="366" font-size="12" fill="#525252">Consumable items • Stored in storeroom • Issued and consumed on work orders</text>
    
    <!-- Rule of thumb note -->
    <rect x="88" y="380" width="512" height="38" fill="#ffffff" stroke="#e0e0e0" rx="4"/>
    <text x="100" y="403" font-size="12" fill="#161616"><tspan font-weight="600" fill="#0f62fe">Rule of thumb:</tspan> Replaced and scrapped during repairs? Model as Item, not Asset.</text>
  </g>
</svg>