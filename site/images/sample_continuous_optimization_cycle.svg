<svg width="680" height="260" viewBox="0 0 680 260" fill="none" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <title>Continuous maintenance performance optimization cycle</title>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Step 1: Execute -->
  <g class="node">
    <rect x="20" y="30" width="130" height="60" rx="2" fill="#0F62FE" stroke="#0F62FE" stroke-width="1.5"/>
    <text x="85" y="53" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.2">STEP 1</text>
    <text x="85" y="72" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Execute work</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 150 60 H 180" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="180,56 188,60 180,64" fill="#161616"/>

  <!-- Step 2: Capture Actuals -->
  <g class="node">
    <rect x="188" y="30" width="130" height="60" rx="2" fill="#EDF5FF" stroke="#0F62FE" stroke-width="1.5"/>
    <text x="253" y="53" font-size="9" font-weight="600" fill="#0043CE" text-anchor="middle" letter-spacing="0.2">STEP 2</text>
    <text x="253" y="72" font-size="11" font-weight="600" fill="#161616" text-anchor="middle">Log actuals</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 318 60 H 348" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="348,56 356,60 348,64" fill="#161616"/>

  <!-- Step 3: Analyze -->
  <g class="node">
    <rect x="356" y="30" width="130" height="60" rx="2" fill="#ffffff" stroke="#0F62FE" stroke-width="1.5"/>
    <rect x="356" y="30" width="5" height="60" fill="#0F62FE"/>
    <text x="421" y="53" font-size="9" font-weight="600" fill="#0F62FE" text-anchor="middle" letter-spacing="0.2">STEP 3</text>
    <text x="421" y="72" font-size="11" font-weight="600" fill="#161616" text-anchor="middle">Analyze KPIs</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 486 60 H 516" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="516,56 524,60 516,64" fill="#161616"/>

  <!-- Step 4: Evaluate -->
  <g class="node">
    <rect x="524" y="30" width="136" height="60" rx="2" fill="#EDF5FF" stroke="#0F62FE" stroke-width="1.5"/>
    <text x="592" y="53" font-size="9" font-weight="600" fill="#0043CE" text-anchor="middle" letter-spacing="0.2">STEP 4</text>
    <text x="592" y="72" font-size="11" font-weight="600" fill="#161616" text-anchor="middle">Identify changes</text>
  </g>

  <!-- Loop back container: Refinement Actions -->
  <g class="node">
    <rect x="100" y="140" width="480" height="65" rx="2" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
    <text x="120" y="165" font-size="10" font-weight="600" fill="#0F62FE">REFINEMENT ACTIONS</text>
    <text x="120" y="184" font-size="11" fill="#161616">Extend PM intervals | Refine job plan torque specs | Pre-stage replacement parts</text>
  </g>

  <!-- Loop Connectors -->
  <path d="M 592 90 V 172 Q 592 180 584 180 H 580" fill="none" stroke="#161616" stroke-width="1.5"/>
  <path d="M 100 172 Q 85 172 85 164 V 98" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="81,98 85,90 89,98" fill="#161616"/>
</svg>
