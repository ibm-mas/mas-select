<svg width="680" height="340" viewBox="0 0 680 340" fill="none" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <title>Sample storeroom topology and inventory replenishment flow</title>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Main Storeroom Node -->
  <g class="node">
    <rect x="20" y="70" width="170" height="70" rx="2" fill="#0F62FE" stroke="#0F62FE" stroke-width="1.5"/>
    <text x="105" y="96" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.2">CENTRAL STOREROOM</text>
    <text x="105" y="114" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Main storeroom</text>
    <text x="105" y="128" font-size="10" fill="#EDF5FF" text-anchor="middle">High-value spares and rotating items</text>
  </g>

  <!-- Connectors from Main Storeroom -->
  <!-- Top: Issue Counter -->
  <path d="M 190 90 H 220 V 50 Q 220 42 228 42 H 240" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="240,38 248,42 240,46" fill="#161616"/>

  <!-- Bottom: Satellite Crib -->
  <path d="M 190 120 H 220 V 160 Q 220 168 228 168 H 240" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="240,164 248,168 240,172" fill="#161616"/>
  <text x="215" y="130" font-size="9" fill="#525252">Bulk restock</text>

  <!-- Node: Issue Counter -->
  <g class="node">
    <rect x="248" y="16" width="190" height="52" rx="2" fill="#EDF5FF" stroke="#0F62FE" stroke-width="1.5"/>
    <text x="262" y="36" font-size="10" font-weight="600" fill="#0043CE">ISSUE COUNTER</text>
    <text x="262" y="53" font-size="11" fill="#161616">Barcode and app checkout</text>
  </g>

  <!-- Node: Satellite Crib -->
  <g class="node">
    <rect x="248" y="142" width="190" height="52" rx="2" fill="#EDF5FF" stroke="#0F62FE" stroke-width="1.5"/>
    <text x="262" y="162" font-size="10" font-weight="600" fill="#0043CE">SATELLITE CRIB</text>
    <text x="262" y="179" font-size="11" fill="#161616">Cold Storage consumable parts</text>
  </g>

  <!-- Connectors to Work Orders -->
  <path d="M 438 42 H 478" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="478,38 486,42 478,46" fill="#161616"/>

  <path d="M 438 168 H 478" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="478,164 486,168 478,172" fill="#161616"/>

  <!-- Work Order Nodes -->
  <g class="node">
    <rect x="486" y="16" width="174" height="52" rx="2" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
    <text x="500" y="36" font-size="10" font-weight="600" fill="#525252">ACTIVE WORK ORDER</text>
    <text x="500" y="53" font-size="11" font-weight="600" fill="#161616">Filler FL-02 overhaul</text>
  </g>

  <g class="node">
    <rect x="486" y="142" width="174" height="52" rx="2" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
    <text x="500" y="162" font-size="10" font-weight="600" fill="#525252">ACTIVE WORK ORDER</text>
    <text x="500" y="179" font-size="11" font-weight="600" fill="#161616">Refrigeration routine</text>
  </g>

  <!-- Reorder Background Task Section -->
  <line x1="20" y1="230" x2="660" y2="230" stroke="#E0E0E0" stroke-dasharray="4 4"/>

  <!-- Reorder Task Node -->
  <g class="node">
    <rect x="20" y="255" width="280" height="60" rx="2" fill="#EDF5FF" stroke="#0F62FE" stroke-width="1.5"/>
    <text x="35" y="278" font-size="10" font-weight="600" fill="#0043CE">BACKGROUND REORDER TASK</text>
    <text x="35" y="296" font-size="11" fill="#161616">Scans stock balances against reorder points daily</text>
  </g>

  <path d="M 300 285 H 370" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="370,281 378,285 370,289" fill="#161616"/>

  <!-- Requisition Node -->
  <g class="node">
    <rect x="378" y="255" width="282" height="60" rx="2" fill="#ffffff" stroke="#0F62FE" stroke-width="1.5"/>
    <rect x="378" y="255" width="6" height="60" fill="#0F62FE"/>
    <text x="396" y="278" font-size="10" font-weight="600" fill="#0F62FE">AUTOMATED REQUISITION</text>
    <text x="396" y="296" font-size="11" fill="#161616">Generates replenishment purchase requests</text>
  </g>
</svg>
