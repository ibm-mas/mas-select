<svg width="480" height="460" viewBox="0 0 480 460" fill="none" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <title>Problem: Over-assetized equipment hierarchy</title>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Level 1: Parent Asset (Filler FL-02) -->
  <g class="node">
    <rect x="16" y="16" width="448" height="48" fill="#ffffff" stroke="#009D9A" stroke-width="1.5"/>
    <rect x="16" y="16" width="48" height="48" fill="#009D9A"/>
    <g transform="translate(28, 28) scale(0.75)" fill="#ffffff">
      <!-- Machine / Asset icon -->
      <path d="M26,8h-4V4c0-1.1-0.9-2-2-2H12C10.9,2,10,2.9,10,4v4H6C4.9,8,4,8.9,4,10v16c0,1.1,0.9,2,2,2h20c1.1,0,2-0.9,2-2V10 C28,8.9,27.1,8,26,8z M12,4h8v4h-8V4z M26,26H6V10h20V26z"/>
      <circle cx="16" cy="18" r="4"/>
    </g>
    <text x="76" y="35" font-size="11" font-weight="600" fill="#525252" letter-spacing="0.2">PARENT ASSET</text>
    <text x="76" y="52" font-size="13" font-weight="600" fill="#161616">Filler FL-02</text>
  </g>

  <!-- Level 2: Subassembly (Nozzle assembly) -->
  <g class="node">
    <rect x="56" y="80" width="408" height="48" fill="#ffffff" stroke="#009D9A" stroke-width="1.5"/>
    <rect x="56" y="80" width="48" height="48" fill="#009D9A"/>
    <g transform="translate(68, 92) scale(0.75)" fill="#ffffff">
