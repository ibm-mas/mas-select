      <path d="M26.4,14.6l-2-0.5c-0.2-0.6-0.4-1.2-0.7-1.7l1.2-1.7c0.4-0.6,0.3-1.4-0.2-1.9l-2.1-2.1c-0.5-0.5-1.3-0.6-1.9-0.2l-1.7,1.2 c-0.6-0.3-1.1-0.5-1.7-0.7l-0.5-2C16.6,4.4,16,4,15.3,4h-3c-0.7,0-1.3,0.5-1.4,1.1l-0.5,2C9.8,7.3,9.2,7.6,8.7,7.9L7,6.6 C6.4,6.3,5.6,6.3,5.1,6.8L3,8.9C2.5,9.4,2.5,10.2,2.8,10.8l1.2,1.7C3.7,13.1,3.5,13.7,3.3,14.3l-2,0.5C0.6,14.9,0.2,15.5,0.2,16.2 v3c0,0.7,0.5,1.3,1.1,1.4l2,0.5c0.2,0.6,0.4,1.2,0.7,1.7l-1.2,1.7c-0.4,0.6-0.3,1.4,0.2,1.9l2.1,2.1c0.5,0.5,1.3,0.6,1.9,0.2l1.7-1.2 c0.6,0.3,1.1,0.5,1.7,0.7l0.5,2C11,30.6,11.6,31,12.3,31h3c0.7,0,1.3-0.5,1.4-1.1l0.5-2c0.6-0.2,1.2-0.4,1.7-0.7l1.7,1.2 c0.6,0.4,1.4,0.3,1.9-0.2l2.1-2.1c0.5-0.5,0.6-1.3,0.2-1.9l-1.2-1.7c0.3-0.6,0.5-1.1,0.7-1.7l2-0.5c0.7-0.2,1.1-0.8,1.1-1.4v-3 C27.5,15.3,27.1,14.7,26.4,14.6z M13.8,21.5c-2.8,0-5-2.2-5-5s2.2-5,5-5s5,2.2,5,5S16.6,21.5,13.8,21.5z"/>
    </g>
    <text x="116" y="99" font-size="11" font-weight="600" fill="#525252" letter-spacing="0.2">SUBASSEMBLY</text>
    <text x="116" y="116" font-size="13" font-weight="600" fill="#161616">Nozzle assembly</text>
  </g>

  <!-- Connector: Filler FL-02 -> Nozzle assembly -->
  <g class="connector">
    <circle cx="36" cy="64" r="3" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
    <path d="M 36 64 V 96 Q 36 104 44 104 H 56" fill="none" stroke="#161616" stroke-width="1.5"/>
    <circle cx="56" cy="104" r="3" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
  </g>

  <!-- Level 3: Child component (Nozzle body) -->
  <g class="node">
    <rect x="96" y="144" width="368" height="48" fill="#D9FBFB" stroke="#009D9A" stroke-width="1.5"/>
    <rect x="96" y="144" width="48" height="48" fill="#009D9A"/>
    <g transform="translate(108, 156) scale(0.75)" fill="#ffffff">
      <path d="M26,10h-6V4c0-1.1-0.9-2-2-2h-4c-1.1,0-2,0.9-2,2v6H6c-1.1,0-2,0.9-2,2v14c0,1.1,0.9,2,2,2h20c1.1,0,2-0.9,2-2V12 C28,10.9,27.1,10,26,10z M14,4h4v6h-4V4z M26,26H6V12h20V26z"/>
    </g>
    <text x="156" y="163" font-size="11" font-weight="600" fill="#525252" letter-spacing="0.2">CHILD COMPONENT (ASSET)</text>
    <text x="156" y="180" font-size="13" font-weight="600" fill="#161616">Nozzle body</text>
  </g>

  <!-- Connector: Nozzle assembly -> Nozzle body -->
  <g class="connector">
    <circle cx="76" cy="128" r="3" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
    <path d="M 76 128 V 160 Q 76 168 84 168 H 96" fill="none" stroke="#161616" stroke-width="1.5"/>
    <circle cx="96" cy="168" r="3" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
  </g>

  <!-- Level 3: Over-assetized Wear Part 1 (O-ring) -->
  <g class="node">
    <rect x="96" y="208" width="368" height="48" fill="#FFF1F1" stroke="#DA1E28" stroke-width="1.5"/>
    <rect x="96" y="208" width="48" height="48" fill="#DA1E28"/>
    <g transform="translate(108, 220) scale(0.75)" fill="#ffffff">
      <!-- Warning / Stop / Wear part icon -->
      <circle cx="16" cy="16" r="10" stroke="#ffffff" stroke-width="2.5" fill="none"/>
    </g>
    <text x="156" y="227" font-size="11" font-weight="700" fill="#DA1E28" letter-spacing="0.2">INCORRECT CHILD ASSET (CONSUMABLE WEAR PART)</text>
    <text x="156" y="244" font-size="13" font-weight="600" fill="#161616">O-ring seal (Item 402)</text>
  </g>

  <!-- Connector: Nozzle assembly -> O-ring -->
  <g class="connector">
    <circle cx="76" cy="128" r="3" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
    <path d="M 76 128 V 224 Q 76 232 84 232 H 96" fill="none" stroke="#161616" stroke-width="1.5"/>
    <circle cx="96" cy="232" r="3" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
  </g>

  <!-- Level 3: Over-assetized Wear Part 2 (Gasket) -->
  <g class="node">
    <rect x="96" y="272" width="368" height="48" fill="#FFF1F1" stroke="#DA1E28" stroke-width="1.5"/>
    <rect x="96" y="272" width="48" height="48" fill="#DA1E28"/>
    <g transform="translate(108, 284) scale(0.75)" fill="#ffffff">
      <!-- Warning / Stop / Wear part icon -->
      <circle cx="16" cy="16" r="10" stroke="#ffffff" stroke-width="2.5" fill="none"/>
    </g>
    <text x="156" y="291" font-size="11" font-weight="700" fill="#DA1E28" letter-spacing="0.2">INCORRECT CHILD ASSET (CONSUMABLE WEAR PART)</text>
    <text x="156" y="308" font-size="13" font-weight="600" fill="#161616">Flange gasket (Item 104)</text>
  </g>

  <!-- Connector: Nozzle assembly -> Gasket -->
  <g class="connector">
    <circle cx="76" cy="128" r="3" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
    <path d="M 76 128 V 288 Q 76 296 84 296 H 96" fill="none" stroke="#161616" stroke-width="1.5"/>
    <circle cx="96" cy="296" r="3" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
  </g>

  <!-- Level 3: Child component (Shutoff valve) -->
  <g class="node">
    <rect x="96" y="336" width="368" height="48" fill="#D9FBFB" stroke="#009D9A" stroke-width="1.5"/>
    <rect x="96" y="336" width="48" height="48" fill="#009D9A"/>
    <g transform="translate(108, 348) scale(0.75)" fill="#ffffff">
      <path d="M26,10h-6V4c0-1.1-0.9-2-2-2h-4c-1.1,0-2,0.9-2,2v6H6c-1.1,0-2,0.9-2,2v14c0,1.1,0.9,2,2,2h20c1.1,0,2-0.9,2-2V12 C28,10.9,27.1,10,26,10z M14,4h4v6h-4V4z M26,26H6V12h20V26z"/>
    </g>
    <text x="156" y="355" font-size="11" font-weight="600" fill="#525252" letter-spacing="0.2">CHILD COMPONENT (ASSET)</text>
    <text x="156" y="372" font-size="13" font-weight="600" fill="#161616">Shutoff valve</text>
  </g>

  <!-- Connector: Nozzle assembly -> Shutoff valve -->
  <g class="connector">
    <circle cx="76" cy="128" r="3" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
    <path d="M 76 128 V 352 Q 76 360 84 360 H 96" fill="none" stroke="#161616" stroke-width="1.5"/>
    <circle cx="96" cy="360" r="3" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
  </g>

  <!-- Problem summary banner (bottom) -->
  <rect x="16" y="404" width="448" height="40" fill="#FFF1F1" stroke="#DA1E28" stroke-width="1"/>
  <text x="32" y="428" font-size="12" font-weight="600" fill="#DA1E28">Design flaw: O-rings and gaskets clutter the asset tree instead of Item Master</text>
</svg>