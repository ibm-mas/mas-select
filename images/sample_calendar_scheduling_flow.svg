  <title id="t">How calendars connect to labor, equipment, and work scheduling</title>
  <desc id="d">Calendars define working shifts and non-working days. Assigning calendars to labor, crews, and locations or assets enables the scheduling engine to calculate availability and set target dates.</desc>
