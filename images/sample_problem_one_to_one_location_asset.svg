<svg width="480" height="420" viewBox="0 0 480 420" fill="none" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <title>Problem: The 1:1 Location-to-Asset Anti-Pattern</title>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Top Level: Room Location -->
  <g class="node">
    <rect x="16" y="16" width="448" height="48" fill="#ffffff" stroke="#009D9A" stroke-width="1.5"/>
    <rect x="16" y="16" width="48" height="48" fill="#009D9A"/>
    <g transform="translate(28, 28) scale(0.75)" fill="#ffffff">
      <path d="M16,2C9.4,2,4,7.4,4,14c0,8.8,12,16,12,16s12-7.2,12-16C28,7.4,22.6,2,16,2z M16,18c-2.2,0-4-1.8-4-4s1.8-4,4-4s4,1.8,4,4 S18.2,18,16,18z"/>
    </g>
    <text x="76" y="35" font-size="11" font-weight="600" fill="#525252" letter-spacing="0.2">PHYSICAL LOCATION</text>
    <text x="76" y="52" font-size="13" font-weight="600" fill="#161616">Filling line room</text>
  </g>

  <!-- Problem Branch 1: Artificial Location 1 -->
  <g class="node-error">
    <rect x="48" y="80" width="416" height="48" fill="#fff1f1" stroke="#da1e28" stroke-width="1.5"/>
    <rect x="48" y="80" width="48" height="48" fill="#da1e28"/>
    <g transform="translate(60, 92) scale(0.75)" fill="#ffffff">
      <path d="M16,2C9.4,2,4,7.4,4,14c0,8.8,12,16,12,16s12-7.2,12-16C28,7.4,22.6,2,16,2z M16,18c-2.2,0-4-1.8-4-4s1.8-4,4-4s4,1.8,4,4 S18.2,18,16,18z"/>
    </g>
    <text x="108" y="99" font-size="11" font-weight="600" fill="#da1e28" letter-spacing="0.2">DUPLICATE ARTIFICIAL LOCATION</text>
    <text x="108" y="116" font-size="13" font-weight="600" fill="#161616">Filler FL-02 Operating Location</text>
  </g>

  <!-- Nested Asset under Artificial Location 1 -->
  <g class="node-asset">
    <rect x="88" y="144" width="376" height="48" fill="#ffffff" stroke="#009D9A" stroke-width="1.5"/>
    <rect x="88" y="144" width="48" height="48" fill="#009D9A"/>
    <g transform="translate(100, 156) scale(0.75)" fill="#ffffff">
      <path d="M26,8h-4V4c0-1.1-0.9-2-2-2H12C10.9,2,10,2.9,10,4v4H6C4.9,8,4,8.9,4,10v16c0,1.1,0.9,2,2,2h20c1.1,0,2-0.9,2-2V10 C28,8.9,27.1,8,26,8z M12,4h8v4h-8V4z M26,26H6V10h20V26z"/>
      <circle cx="16" cy="18" r="4"/>
    </g>
    <text x="148" y="163" font-size="11" font-weight="600" fill="#525252" letter-spacing="0.2">ASSET (1:1 MAPPING)</text>
    <text x="148" y="180" font-size="13" font-weight="600" fill="#161616">Filler FL-02</text>
  </g>

  <!-- Problem Branch 2: Artificial Location 2 -->
  <g class="node-error">
    <rect x="48" y="208" width="416" height="48" fill="#fff1f1" stroke="#da1e28" stroke-width="1.5"/>
    <rect x="48" y="208" width="48" height="48" fill="#da1e28"/>
    <g transform="translate(60, 220) scale(0.75)" fill="#ffffff">
      <path d="M16,2C9.4,2,4,7.4,4,14c0,8.8,12,16,12,16s12-7.2,12-16C28,7.4,22.6,2,16,2z M16,18c-2.2,0-4-1.8-4-4s1.8-4,4-4s4,1.8,4,4 S18.2,18,16,18z"/>
    </g>
    <text x="108" y="227" font-size="11" font-weight="600" fill="#da1e28" letter-spacing="0.2">DUPLICATE ARTIFICIAL LOCATION</text>
    <text x="108" y="244" font-size="13" font-weight="600" fill="#161616">Syrup Pump P-101 Operating Location</text>
  </g>

  <!-- Nested Asset under Artificial Location 2 -->
  <g class="node-asset">
    <rect x="88" y="272" width="376" height="48" fill="#ffffff" stroke="#009D9A" stroke-width="1.5"/>
    <rect x="88" y="272" width="48" height="48" fill="#009D9A"/>
    <g transform="translate(100, 284) scale(0.75)" fill="#ffffff">
      <path d="M26,8h-4V4c0-1.1-0.9-2-2-2H12C10.9,2,10,2.9,10,4v4H6C4.9,8,4,8.9,4,10v16c0,1.1,0.9,2,2,2h20c1.1,0,2-0.9,2-2V10 C28,8.9,27.1,8,26,8z M12,4h8v4h-8V4z M26,26H6V10h20V26z"/>
      <circle cx="16" cy="18" r="4"/>
    </g>
    <text x="148" y="291" font-size="11" font-weight="600" fill="#525252" letter-spacing="0.2">ASSET (1:1 MAPPING)</text>
    <text x="148" y="308" font-size="13" font-weight="600" fill="#161616">Syrup Pump P-101</text>
  </g>

  <!-- Connectors -->
  <path d="M 36 64 V 104 H 48" fill="none" stroke="#da1e28" stroke-width="1.5"/>
  <path d="M 68 128 V 168 H 88" fill="none" stroke="#161616" stroke-width="1.5"/>
  <path d="M 36 104 V 232 H 48" fill="none" stroke="#da1e28" stroke-width="1.5"/>
  <path d="M 68 256 V 296 H 88" fill="none" stroke="#161616" stroke-width="1.5"/>

  <!-- Warning Banner at Bottom -->
  <rect x="16" y="340" width="448" height="64" fill="#fff1f1" stroke="#da1e28" stroke-width="1.5" rx="2"/>
  <text x="240" y="362" font-size="12" font-weight="600" fill="#da1e28" text-anchor="middle">Problem: 1:1 duplicate locations double maintenance overhead</text>
  <text x="240" y="382" font-size="11" fill="#525252" text-anchor="middle">Swapping equipment requires renaming locations and breaks mobile drilldown</text>
</svg>
