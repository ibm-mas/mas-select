<svg width="710" height="180" viewBox="0 0 710 180" fill="none" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <title>Financial and material flow between storeroom, work order, and operating location</title>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Node 1: Main Storeroom -->
  <g class="node">
    <rect x="20" y="55" width="120" height="70" rx="2" fill="#EDF5FF" stroke="#0F62FE" stroke-width="1.5"/>
    <text x="80" y="80" font-size="10" font-weight="600" fill="#0043CE" text-anchor="middle" letter-spacing="0.2">STOREROOM</text>
    <text x="80" y="98" font-size="11" font-weight="600" fill="#161616" text-anchor="middle">Main storeroom</text>
    <text x="80" y="112" font-size="10" fill="#525252" text-anchor="middle">Holds spare parts</text>
  </g>

  <!-- Connector 1 -->
  <path d="M 140 90 H 202" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="202,86 210,90 202,94" fill="#161616"/>
  <text x="175" y="78" font-size="9" fill="#525252" text-anchor="middle">Issue parts</text>

  <!-- Node 2: Work Order -->
  <g class="node">
    <rect x="210" y="55" width="120" height="70" rx="2" fill="#ffffff" stroke="#0F62FE" stroke-width="1.5"/>
    <rect x="210" y="55" width="6" height="70" fill="#0F62FE"/>
    <text x="273" y="80" font-size="10" font-weight="600" fill="#0F62FE" text-anchor="middle" letter-spacing="0.2">WORK ORDER</text>
    <text x="273" y="98" font-size="11" font-weight="600" fill="#161616" text-anchor="middle">Filler FL-02</text>
    <text x="273" y="112" font-size="10" fill="#525252" text-anchor="middle">Consumes materials</text>
  </g>

  <!-- Connector 2 -->
  <path d="M 330 90 H 392" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="392,86 400,90 392,94" fill="#161616"/>
  <text x="365" y="78" font-size="9" fill="#525252" text-anchor="middle">Operates at</text>

  <!-- Node 3: Operating Location -->
  <g class="node">
    <rect x="400" y="55" width="120" height="70" rx="2" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
    <text x="460" y="80" font-size="10" font-weight="600" fill="#525252" text-anchor="middle" letter-spacing="0.2">LOCATION</text>
    <text x="460" y="98" font-size="11" font-weight="600" fill="#161616" text-anchor="middle">Filling line room</text>
    <text x="460" y="112" font-size="10" fill="#525252" text-anchor="middle">Physical space</text>
  </g>

  <!-- Connector 3 -->
  <path d="M 520 90 H 582" fill="none" stroke="#161616" stroke-width="1.5"/>
  <polygon points="582,86 590,90 582,94" fill="#161616"/>

  <!-- Node 4: Financial Rollup -->
  <g class="node">
    <rect x="590" y="55" width="100" height="70" rx="2" fill="#EDF5FF" stroke="#0F62FE" stroke-width="1.5"/>
    <text x="640" y="80" font-size="9" font-weight="600" fill="#0043CE" text-anchor="middle">COST TRACKING</text>
    <text x="640" y="96" font-size="10" font-weight="600" fill="#161616" text-anchor="middle">Asset and</text>
    <text x="640" y="110" font-size="10" font-weight="600" fill="#161616" text-anchor="middle">Location</text>
  </g>
</svg>
