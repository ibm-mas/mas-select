<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" width="1080" height="520" role="img" aria-labelledby="t d" style="background:#ffffff; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
  <title id="t">Failure reporting workflow from asset class to remedy</title>
  <desc id="d">The asset record pre-fills the failure class on the work order. Technicians select the specific problem, identify the root cause, and record the remedy code before closing the work order and logging equipment downtime.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#161616"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect class="node" id="n_s1" x="32" y="32" width="1016" height="72" rx="8" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/>
  <path d="M 40 32 Q 32 32 32 40 V 96 Q 32 104 40 104 Z" fill="#0f62fe"/>
<g transform="translate(56 56) scale(0.75)" fill="#161616"><path d="M12,24a4,4,0,1,1,4-4A4.0042,4.0042,0,0,1,12,24Zm0-6a2,2,0,1,0,2,2A2.0023,2.0023,0,0,0,12,18Z"/><path d="M30,6a4.0042,4.0042,0,0,0-4-4,3.949,3.949,0,0,0-1.8537.4768L7.7571,10.9579A9.9921,9.9921,0,1,0,21.066,24.1929l8.49-16.3994A3.9491,3.9491,0,0,0,30,6ZM26,4a2,2,0,1,1-2,2A2.0023,2.0023,0,0,1,26,4ZM22.0194,5.8083C22.0163,5.8732,22,5.9343,22,6a4.0042,4.0042,0,0,0,4,4c.0645,0,.1245-.016.1882-.019l-4.3318,8.3617a10.0168,10.0168,0,0,0-8.2158-8.1962ZM12,28a8,8,0,1,1,8-8A8.0092,8.0092,0,0,1,12,28Z"/></g>
  <text x="104" y="63" font-size="14" font-weight="600" fill="#161616">1. Asset failure class</text>
  <text x="104" y="85" font-size="12" fill="#525252">Example: Filling and Packaging</text>
  <text x="560" y="74" font-size="13" font-weight="500" fill="#161616">Pre-fills failure hierarchy on work order</text>
  <rect class="node" id="n_s2" x="32" y="128" width="1016" height="72" rx="8" fill="#ffffff" stroke="#fa4d56" stroke-width="1"/>
  <path d="M 40 128 Q 32 128 32 136 V 192 Q 32 200 40 200 Z" fill="#fa4d56"/>
<g transform="translate(56 152) scale(0.75)" fill="#fa4d56"><path d="M16,2C8.3,2,2,8.3,2,16s6.3,14,14,14s14-6.3,14-14C30,8.3,23.7,2,16,2z M14.9,8h2.2v11h-2.2V8z M16,25&#9;c-0.8,0-1.5-0.7-1.5-1.5S15.2,22,16,22c0.8,0,1.5,0.7,1.5,1.5S16.8,25,16,25z"/></g>
  <text x="104" y="159" font-size="14" font-weight="600" fill="#161616">2. Problem code</text>
  <text x="104" y="181" font-size="12" fill="#525252">Example: Nozzle seal leak on Filler FL-02</text>
  <text x="560" y="170" font-size="13" font-weight="500" fill="#161616">Identifies what specifically failed</text>
  <rect class="node" id="n_s3" x="32" y="224" width="1016" height="72" rx="8" fill="#ffffff" stroke="#8a3ffc" stroke-width="1"/>
  <path d="M 40 224 Q 32 224 32 232 V 288 Q 32 296 40 296 Z" fill="#8a3ffc"/>
<g transform="translate(56 248) scale(0.75)" fill="#161616"><path d="M29,27.5859l-7.5521-7.5521a11.0177,11.0177,0,1,0-1.4141,1.4141L27.5859,29ZM4,13a9,9,0,1,1,9,9A9.01,9.01,0,0,1,4,13Z"/></g>
  <text x="104" y="255" font-size="14" font-weight="600" fill="#161616">3. Cause code</text>
  <text x="104" y="277" font-size="12" fill="#525252">Example: Normal wear or seal degradation</text>
  <text x="560" y="266" font-size="13" font-weight="500" fill="#161616">Identifies the root cause of the breakdown</text>
  <rect class="node" id="n_s4" x="32" y="320" width="1016" height="72" rx="8" fill="#ffffff" stroke="#007d79" stroke-width="1"/>
  <path d="M 40 320 Q 32 320 32 328 V 384 Q 32 392 40 392 Z" fill="#007d79"/>
<g transform="translate(56 344) scale(0.75)" fill="#161616"><path d="M12.1,2A9.8,9.8,0,0,0,6.7,3.6L13.1,10a2.1,2.1,0,0,1,.2,3,2.1,2.1,0,0,1-3-.2L3.7,6.4A9.84,9.84,0,0,0,2,12.1,10.14,10.14,0,0,0,12.1,22.2a10.9,10.9,0,0,0,2.6-.3l6.7,6.7a5,5,0,0,0,7.1-7.1l-6.7-6.7a10.9,10.9,0,0,0,.3-2.6A10,10,0,0,0,12.1,2Zm8,10.1a7.61,7.61,0,0,1-.3,2.1l-.3,1.1.8.8L27,22.8a2.88,2.88,0,0,1,.9,2.1A2.72,2.72,0,0,1,27,27a2.9,2.9,0,0,1-4.2,0l-6.7-6.7-.8-.8-1.1.3a7.61,7.61,0,0,1-2.1.3,8.27,8.27,0,0,1-5.7-2.3A7.63,7.63,0,0,1,4,12.1a8.33,8.33,0,0,1,.3-2.2l4.4,4.4a4.14,4.14,0,0,0,5.9.2,4.14,4.14,0,0,0-.2-5.9L10,4.2a6.45,6.45,0,0,1,2-.3,8.27,8.27,0,0,1,5.7,2.3A8.49,8.49,0,0,1,20.1,12.1Z"/></g>
  <text x="104" y="351" font-size="14" font-weight="600" fill="#161616">4. Remedy code</text>
  <text x="104" y="373" font-size="12" fill="#525252">Example: Replaced seal and cleaned nozzle assembly</text>
  <text x="560" y="362" font-size="13" font-weight="500" fill="#161616">Records the specific corrective fix applied</text>
  <rect class="node" id="n_s5" x="32" y="416" width="1016" height="72" rx="8" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/>
  <path d="M 40 416 Q 32 416 32 424 V 480 Q 32 488 40 488 Z" fill="#0f62fe"/>
<g transform="translate(56 440) scale(0.75)" fill="#161616"><path d="M14 21.414 9 16.413 10.413 15 14 18.586 21.585 11 23 12.415 14 21.414z"/><path d="M16,2A14,14,0,1,0,30,16,14,14,0,0,0,16,2Zm0,26A12,12,0,1,1,28,16,12,12,0,0,1,16,28Z"/></g>
  <text x="104" y="447" font-size="14" font-weight="600" fill="#161616">5. Downtime and history</text>
  <text x="104" y="469" font-size="12" fill="#525252">Example: Downtime logged and work order closed</text>
  <text x="560" y="458" font-size="13" font-weight="500" fill="#161616">Feeds reliability reporting and trend analysis</text>
  <!-- Connectors -->
  <path class="connector" id="k1" data-from="n_s1" data-to="n_s2" fill="none" stroke="#161616" stroke-width="1" marker-end="url(#arrow)" d="M 64 104 V 128"/>
  <path class="connector" id="k2" data-from="n_s2" data-to="n_s3" fill="none" stroke="#161616" stroke-width="1" marker-end="url(#arrow)" d="M 64 200 V 224"/>
  <path class="connector" id="k3" data-from="n_s3" data-to="n_s4" fill="none" stroke="#161616" stroke-width="1" marker-end="url(#arrow)" d="M 64 296 V 320"/>
  <path class="connector" id="k4" data-from="n_s4" data-to="n_s5" fill="none" stroke="#161616" stroke-width="1" marker-end="url(#arrow)" d="M 64 392 V 416"/>
</svg>